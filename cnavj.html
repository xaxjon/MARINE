<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HO-229 Sight Reduction & Plotter</title>
     <!-- Logging interface -->
    <script src="https://xaxero.com/dlog/tracker.js" data-app-name="CNAVJ"></script>
   
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Roboto+Mono:wght@300;400;600&family=Merriweather:wght@300;400;700&display=swap');

        .red-mode {
            filter: sepia(100%) hue-rotate(-50deg) saturate(400%) contrast(1.2);
            background-color: #050000 !important;
            color: #d00 !important;
        }
        .red-mode button, .red-mode input, .red-mode select, .red-mode option, .red-mode .card, .red-mode .modal-content, .red-mode table, .red-mode th, .red-mode .border, .red-mode .border-b, .red-mode .border-t, .red-mode .divide-y > :not([hidden]) ~ :not([hidden]) {
            border-color: #800 !important;
            background-color: #1a0000 !important;
            color: #f00 !important;
        }
        .red-mode .bg-white, .red-mode .bg-slate-50, .red-mode .bg-slate-100, .red-mode .bg-slate-800, .red-mode .bg-slate-900, .red-mode .bg-gray-100 {
            background-color: #150000 !important;
            color: #f00 !important;
        }
        .red-mode .text-slate-500, .red-mode .text-slate-600, .red-mode .text-slate-400, .red-mode .text-slate-700 {
            color: #b91c1c !important;
        }
        .red-mode .bg-blue-50, .red-mode .bg-green-50, .red-mode .bg-amber-50, .red-mode .bg-gray-50, .red-mode .bg-purple-50 {
             background-color: #300 !important;
             color: #f55 !important;
        }
        
        /* Canvas specific for red mode */
        .red-mode canvas {
            filter: invert(1) hue-rotate(180deg); 
            background-color: #222 !important;
        }

        /* HO229 Page Styling */
        .ho229-page {
            font-family: 'Courier Prime', monospace;
            background-color: #fdfbf7;
            background-image: radial-gradient(#e5e5e5 1px, transparent 1px);
            background-size: 20px 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #d1d5db;
        }
        .ho-header { font-family: 'Merriweather', serif; }
        .handwritten-circle { position: relative; z-index: 10; }
        .handwritten-circle::after {
            content: ''; position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
            border: 2px solid #ef4444; border-radius: 50% 60% 50% 40% / 50% 50% 60% 60%;
            transform: rotate(-2deg); pointer-events: none; opacity: 0.8;
        }
        .red-mode .ho229-page { background-color: #1a0000; background-image: none; border-color: #800; }
        .red-mode .handwritten-circle::after { border-color: #f00; }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Prevents iOS zoom on inputs */
        input, select, textarea { font-size: 16px !important; }

        /* Form Row Styles */
        .form-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #e2e8f0; }
        .form-row:last-child { border-bottom: none; }
        .form-label { font-size: 0.85rem; color: #64748b; display: flex; align-items: center; gap: 4px; }
        .form-val { font-family: monospace; font-weight: 600; font-size: 1rem; }
        .red-mode .form-row { border-color: #600; }
        
        /* Study Mode Styles */
        .help-icon { cursor: pointer; transition: all 0.2s; opacity: 0.7; }
        .help-icon:hover { opacity: 1; transform: scale(1.1); }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 transition-colors duration-300 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ==========================================
        // MODULE 1: CONSTANTS & UTILITIES
        // ==========================================
        
        const CONSTANTS = {
            STARS: {
                "Acamar": { ra: 2.9723, dec: -40.3046 }, "Achernar": { ra: 1.6285, dec: -57.2424 }, "Acrux": { ra: 12.4433, dec: -63.0990 },
                "Adhara": { ra: 6.9771, dec: -28.9720 }, "Aldebaran": { ra: 4.5986, dec: 16.5093 }, "Alioth": { ra: 12.9004, dec: 55.9598 },
                "Alkaid": { ra: 13.7923, dec: 49.3133 }, "Alnair": { ra: 22.1372, dec: -46.9610 }, "Alnilam": { ra: 5.6035, dec: -1.2019 },
                "Alphard": { ra: 9.4597, dec: -8.6586 }, "Alphecca": { ra: 15.5781, dec: 26.7147 }, "Alpheratz": { ra: 0.1397, dec: 29.0904 },
                "Altair": { ra: 19.8463, dec: 8.8683 }, "Ankaa": { ra: 0.4380, dec: -42.3051 }, "Antares": { ra: 16.4901, dec: -26.4320 },
                "Arcturus": { ra: 14.2610, dec: 19.1822 }, "Atria": { ra: 16.8111, dec: -69.0277 }, "Avior": { ra: 8.3752, dec: -59.5094 },
                "Bellatrix": { ra: 5.4188, dec: 6.3497 }, "Betelgeuse": { ra: 5.9195, dec: 7.4070 }, "Canopus": { ra: 6.3991, dec: -52.6956 },
                "Capella": { ra: 5.2781, dec: 45.9979 }, "Deneb": { ra: 20.6905, dec: 45.2803 }, "Denebola": { ra: 11.8176, dec: 14.5720 },
                "Diphda": { ra: 0.7264, dec: -17.9866 }, "Dubhe": { ra: 11.0621, dec: 61.7510 }, "Eltanin": { ra: 17.9434, dec: 51.4889 },
                "Enif": { ra: 21.7364, dec: 9.8750 }, "Fomalhaut": { ra: 22.9608, dec: -29.6222 }, "Gacrux": { ra: 12.5194, dec: -57.1132 },
                "Gienah": { ra: 12.2634, dec: -17.5419 }, "Hadar": { ra: 14.0637, dec: -60.3730 }, "Hamal": { ra: 2.1185, dec: 23.4624 },
                "Kaus Australis": { ra: 18.4028, dec: -34.3846 }, "Kochab": { ra: 14.8450, dec: 74.1555 }, "Markab": { ra: 23.0793, dec: 15.2053 },
                "Menkar": { ra: 3.0390, dec: 4.0897 }, "Menkent": { ra: 14.1112, dec: -36.3692 }, "Miaplacidus": { ra: 9.2206, dec: -69.7172 },
                "Mirfak": { ra: 3.4053, dec: 49.8612 }, "Nunki": { ra: 18.9183, dec: -26.2967 }, "Peacock": { ra: 20.4274, dec: -56.7351 },
                "Polaris": { ra: 2.5303, dec: 89.2641 }, "Pollux": { ra: 7.7552, dec: 28.0261 }, "Procyon": { ra: 7.6551, dec: 5.2249 },
                "Rasalhague": { ra: 17.5906, dec: 12.5600 }, "Regulus": { ra: 10.1395, dec: 11.9672 }, "Rigel": { ra: 5.2422, dec: -8.2016 },
                "Rigil Kentaurus": { ra: 14.6607, dec: -60.8339 }, "Sabik": { ra: 17.1715, dec: -15.7249 }, "Schedar": { ra: 0.6751, dec: 56.5373 },
                "Shaula": { ra: 17.5615, dec: -37.1038 }, "Sirius": { ra: 6.7524, dec: -16.7161 }, "Spica": { ra: 13.4198, dec: -11.1613 },
                "Suhail": { ra: 9.1332, dec: -43.4326 }, "Vega": { ra: 18.6156, dec: 38.7837 }, "Zubenelgenubi": { ra: 14.8481, dec: -16.0417 }
            },
            PLANETS: ["Venus", "Mars", "Jupiter", "Saturn"],
            HELP_TEXT: {
                body: "The celestial body (Star, Sun, Moon, Planet) being observed. Different bodies require different corrections (e.g., Parallax for Moon, Semi-diameter for Sun/Moon).",
                hs: "Sextant Altitude (Hs): The raw angle measured by the sextant from the horizon to the body.",
                ie: "Index Error (IE): A mechanical error in the sextant. Check by aligning the horizon in both mirrors. If the horizon doesn't line up at 0°0.0', the difference is IE.",
                he: "Height of Eye (Dip): Correction for the observer's elevation above sea level. The higher you are, the lower the horizon appears, requiring a negative correction.",
                course: "Ship's Course: The direction the vessel is moving, used to advance Lines of Position (LOPs) to a common time.",
                speed: "Ship's Speed: Speed in knots, used to calculate distance traveled when running LOPs forward.",
                ap: "Assumed Position (AP): A position chosen close to your Dead Reckoning (DR). For H.O. 229 table entry, use an Integer Latitude and choose an Assumed Longitude that results in an Integer LHA.",
                ha: "Apparent Altitude (Ha): Sextant altitude corrected for Index Error and Dip. This is the altitude relative to the true horizon, but still affected by atmosphere.",
                mainCorr: "Main Correction: Combines Refraction (bending of light by atmosphere) and Semi-Diameter (SD). SD corrects from the edge (limb) of the Sun/Moon to the center.",
                envCorr: "Atmospheric Correction: Additional refraction correction based on Temperature and Pressure. Cold air and High pressure increase refraction (making stars appear higher), requiring a larger subtraction.",
                parallax: "Parallax: Significant only for the Moon. Corrects for the difference in angle seeing the Moon from the Earth's surface versus the Earth's center.",
                ho: "Observed Altitude (Ho): The final 'True' altitude of the body relative to the celestial horizon/Earth's center. This is what we compare against the calculated altitude.",
                gha: "Greenwich Hour Angle (GHA): The longitude of the body's Geographic Position (GP) measured West from Greenwich. Think of it as the 'Celestial Longitude'.",
                incr: "Increment: The amount the Earth turned (and the body moved) since the last whole hour. Added to GHA.",
                sha: "Sidereal Hour Angle (SHA): For stars, GHA is calculated as GHA Aries + SHA Star. SHA is the angle from the First Point of Aries to the star.",
                vcorr: "v Correction: A correction for planets and the moon because they don't move at exactly 15° per hour like the sun/stars. It adjusts the GHA.",
                dcorr: "d Correction: Adjusts the Declination for the time elapsed since the last whole hour, based on how fast the body is moving North/South.",
                lha: "Local Hour Angle (LHA): The angular distance of the body West of your meridian. LHA = GHA + East Lon (or - West Lon). Used to enter Sight Reduction Tables.",
                dec: "Declination (Dec): The celestial equivalent of Latitude. The angular distance of the body North or South of the Celestial Equator.",
                hc: "Computed Altitude (Hc): What the altitude *should* be if you were exactly at your Assumed Position. Calculated using spherical trigonometry.",
                intercept: "Intercept (a): The difference between Observed (Ho) and Computed (Hc) altitude. Ho > Hc = Towards (T). Ho < Hc = Away (A). This is the distance in nm from the AP to the LOP.",
                zn: "Azimuth (Zn): The true bearing to the body's Geographic Position (GP) from your Assumed Position. The Intercept is plotted along this line."
            }
        };
        const NAV_STARS_LIST = Object.keys(CONSTANTS.STARS).sort();

        const Formatters = {
            angle: (degrees, isLatDec = false) => {
                if (degrees === null || degrees === undefined || isNaN(degrees)) return "-";
                let sign = "";
                const absDeg = Math.abs(degrees);
                if (isLatDec) {
                    sign = degrees >= 0 ? "+" : "-"; 
                } else {
                    sign = degrees < 0 ? "-" : "";
                }
                let d = Math.floor(absDeg);
                let m = (absDeg - d) * 60;
                let mStr = m.toFixed(1);
                
                if (mStr === "60.0") {
                    d += 1;
                    mStr = "0.0";
                }
                
                return `${sign}${d}° ${mStr.padStart(4, '0')}'`;
            },
            lat: (degrees) => {
                if (degrees === null || degrees === undefined || isNaN(degrees)) return "-";
                const suffix = degrees >= 0 ? "N" : "S";
                const absDeg = Math.abs(degrees);
                let d = Math.floor(absDeg);
                let m = (absDeg - d) * 60;
                let mStr = m.toFixed(1);
                
                if (mStr === "60.0") {
                    d += 1;
                    mStr = "0.0";
                }
                
                return `${d}° ${mStr.padStart(4, '0')}' ${suffix}`;
            },
            dec: (degrees) => {
                if (degrees === null || degrees === undefined || isNaN(degrees)) return "-";
                const suffix = degrees >= 0 ? "N" : "S";
                const absDeg = Math.abs(degrees);
                let d = Math.floor(absDeg);
                let m = (absDeg - d) * 60;
                let mStr = m.toFixed(1);
                
                if (mStr === "60.0") {
                    d += 1;
                    mStr = "0.0";
                }
                
                return `${d}° ${mStr.padStart(4, '0')}' ${suffix}`;
            },
            gha: (degrees) => {
                if (degrees === null || degrees === undefined || isNaN(degrees)) return "-";
                let dVal = degrees % 360;
                if (dVal < 0) dVal += 360;
                let d = Math.floor(dVal);
                let m = (dVal - d) * 60;
                let mStr = m.toFixed(1);
                
                if (mStr === "60.0") {
                    d += 1;
                    mStr = "0.0";
                }
                
                return `${d}° ${mStr.padStart(4, '0')}'`;
            },
            inputDisplay: (val) => {
                if (!val && val !== 0) return '';
                let num = parseFloat(val);
                if (isNaN(num)) return val;
                let sign = num < 0 ? '-' : '';
                num = Math.abs(num);
                let d = Math.floor(num);
                let m = ((num - d) * 60).toFixed(1);
                if (parseFloat(m) === 60.0) { d++; m = '0.0'; }
                return `${sign}${d}° ${m}'`;
            },
            decimal: (num, precision) => {
                if (num === null || num === undefined || isNaN(num)) return "-";
                return num.toFixed(precision);
            }
        };

        // ==========================================
        // MODULE 2: NAVIGATION MATH ENGINE
        // ==========================================

        const NavMath = {
            precess: (raJ2000, decJ2000, date) => {
                const yearsSince2000 = (date.getTime() - Date.UTC(2000, 0, 1, 12, 0, 0)) / (365.25 * 24 * 3600 * 1000);
                const raRad = raJ2000 * 15 * (Math.PI / 180);
                const decRad = decJ2000 * (Math.PI / 180);
                const deltaRaSeconds = (3.075 + 1.336 * Math.sin(raRad) * Math.tan(decRad)) * yearsSince2000;
                const deltaDecArcseconds = (20.04 * Math.cos(raRad)) * yearsSince2000;
                return { ra: raJ2000 + (deltaRaSeconds / 3600), dec: decJ2000 + (deltaDecArcseconds / 3600) };
            },

            getBodyState: (date, bodyType, starName) => {
                if (!window.Astronomy) return null;
                const gast = window.Astronomy.SiderealTime(date); 
                const ghaAries = (gast * 15) % 360;
                const observer = new window.Astronomy.Observer(0, 0, -6378137);

                let equ, dist, name, mag;
                let gha = null, sha = null, dec = null;

                try {
                    if (bodyType === 'Sun') {
                        name = 'Sun';
                        equ = window.Astronomy.Equator(window.Astronomy.Body.Sun, date, observer, true, true);
                        dist = equ.dist;
                    } else if (bodyType === 'Moon') {
                        name = 'Moon';
                        equ = window.Astronomy.Equator(window.Astronomy.Body.Moon, date, observer, true, true);
                        dist = equ.dist;
                    } else if (CONSTANTS.PLANETS.includes(bodyType)) {
                        name = bodyType;
                        const body = window.Astronomy.Body[bodyType];
                        equ = window.Astronomy.Equator(body, date, observer, true, true);
                        const illum = window.Astronomy.Illumination(body, date);
                        mag = illum.mag;
                        dist = equ.dist;
                    } 
                    if (equ) {
                        dec = equ.dec;
                        let raDeg = equ.ra * 15;
                        gha = ghaAries - raDeg;
                        sha = 360 - raDeg;
                    }
                    if ((bodyType === 'Star' || bodyType === 'Aries') && starName) {
                        name = starName;
                        const starJ2000 = CONSTANTS.STARS[starName];
                        if (starJ2000) {
                            const starCurrent = NavMath.precess(starJ2000.ra, starJ2000.dec, date);
                            const raDeg = starCurrent.ra * 15; 
                            dec = starCurrent.dec;
                            sha = 360 - raDeg;
                            if (sha < 0) sha += 360;
                            gha = ghaAries + sha;
                            if (gha >= 360) gha -= 360;
                        }
                    }
                    if (gha !== null) { if (gha < 0) gha += 360; if (gha >= 360) gha -= 360; }
                    if (sha !== null) { if (sha < 0) sha += 360; if (sha >= 360) sha -= 360; }
                    return { name, gha, dec, dist, mag, ghaAries, sha };
                } catch (e) { return null; }
            },

            calculateAlmanac: (date, bodyType, starName) => {
                if (!window.Astronomy) return null;
                const wholeHourDate = new Date(date);
                wholeHourDate.setUTCMinutes(0, 0, 0);
                const nextHourDate = new Date(wholeHourDate.getTime() + 3600000);
                const current = NavMath.getBodyState(wholeHourDate, bodyType, starName);
                const next = NavMath.getBodyState(nextHourDate, bodyType, starName);

                if (!current || !next) return null;

                let v = null, dVal = null, hp = null, sd = null;

                if (current.gha !== null && next.gha !== null) {
                    let ghaDiff = next.gha - current.gha;
                    if (ghaDiff < 0) ghaDiff += 360;
                    if (bodyType === 'Moon') v = (ghaDiff - 14.316666) * 60; 
                    else if (CONSTANTS.PLANETS.includes(bodyType)) v = (ghaDiff - 15.0) * 60;
                    else if (bodyType === 'Sun') v = (ghaDiff - 15.0) * 60;

                    if (current.dec !== null && next.dec !== null) dVal = (next.dec - current.dec) * 60;

                    const Re = 6378.14; const AU = 149597870.7;
                    if (current.dist) {
                        const distKm = current.dist * AU;
                        if (bodyType === 'Moon') {
                            const hpRad = Math.asin(Re / distKm);
                            hp = (hpRad * 180 / Math.PI) * 60; 
                            sd = 0.2725 * hp;
                        } else if (bodyType === 'Sun') {
                             const R_sun = 696340;
                             const sdRad = Math.asin(R_sun / distKm);
                             sd = (sdRad * 180 / Math.PI) * 60; 
                        }
                    }
                }
                return { wholeHourTime: wholeHourDate, ...current, v, d: dVal, hp, sd };
            },
            
            // Helper for Spherical Trig used by HO229
            // Returns Z (Azimuth Angle) as 0-180 measured from the ELEVATED POLE.
            // Zn is the True Azimuth (0-360) measured from North clockwise.
            solveTriangle: (lat, dec, lha) => {
                const toRad = deg => deg * Math.PI / 180;
                const toDeg = rad => rad * 180 / Math.PI;
                const latRad = toRad(lat);
                const decRad = toRad(dec);
                const lhaRad = toRad(lha);
                
                // Hc Calculation (Altitude)
                const sinHc = Math.sin(latRad) * Math.sin(decRad) + Math.cos(latRad) * Math.cos(decRad) * Math.cos(lhaRad);
                let hcRad = Math.asin(sinHc);
                let hc = toDeg(hcRad);
                
                // Z Calculation (Azimuth Angle)
                // Standard Formula for Z relative to North Pole:
                // cos Z = (sin Dec - sin Lat * sin Hc) / (cos Lat * cos Hc)
                let numerator = Math.sin(decRad) - (Math.sin(latRad) * sinHc);
                let denominator = Math.cos(latRad) * Math.cos(hcRad);
                let cosZ = numerator / denominator;
                
                if (cosZ > 1) cosZ = 1; 
                if (cosZ < -1) cosZ = -1;
                
                let zRaw = toDeg(Math.acos(cosZ)); // This is angle from North Pole (0..180)
                
                // H.O. 229 Z is measured from the ELEVATED POLE (N if Lat>0, S if Lat<0)
                // If Lat is South, the Elevated Pole is South. 
                // The raw formula gives distance from North. Distance from South is 180 - raw.
                let z = (lat >= 0) ? zRaw : (180 - zRaw);
                
                // Calculate Zn (True Azimuth)
                // Rules:
                // N. Lat: LHA > 180 (East) -> Zn = Z
                // N. Lat: LHA < 180 (West) -> Zn = 360 - Z
                // S. Lat: LHA > 180 (East) -> Zn = 180 - Z
                // S. Lat: LHA < 180 (West) -> Zn = 180 + Z
                
                let zn = 0;
                if (lat >= 0) { // North
                    zn = (lha > 180) ? z : 360 - z;
                } else { // South
                    zn = (lha > 180) ? 180 - z : 180 + z;
                }
                
                return { hc, z, zn };
            },
            
            // Core Sight Reduction Math
            reduceSight: (obsData, almData) => {
                const dt = obsData.dateTime ? new Date(obsData.dateTime) : new Date();
                const minutes = dt.getUTCMinutes();
                const seconds = dt.getUTCSeconds();
                const decimalMinutes = minutes + (seconds / 60);
                
                const isStar = obsData.body && (CONSTANTS.STARS[obsData.body] || obsData.body === 'Aries');
                const isMoon = obsData.body === 'Moon';
                const isSun = obsData.body === 'Sun';

                // Sun rate varies ~14.96-15.04°/hr through the year; use v-correction like planets
                // Stars use sidereal rate; Moon uses lunar rate; Sun & planets use 15°/hr base + v
                let rate = 15.0; if (isMoon) rate = 14.3166; if (isStar) rate = 15.04107; 
                let ghaInc = decimalMinutes * (rate / 60.0);
                let vCorr = 0;
                if (isSun && almData.v != null) {
                    vCorr = almData.v * (decimalMinutes / 60.0) / 60.0;
                } else {
                    vCorr = (almData.v || 0) * (decimalMinutes / 60.0) / 60.0;
                }
                let ghaFinal = 0;
                
                if (isStar && almData.ghaAries != null) {
                    let ghaAriesTotal = almData.ghaAries + ghaInc; 
                    ghaFinal = ghaAriesTotal + almData.sha;
                } else {
                    const baseGha = (almData.ghaWhole != null) ? almData.ghaWhole : almData.gha;
                    if (baseGha != null) {
                        ghaFinal = baseGha + ghaInc + vCorr;
                    }
                }
                ghaFinal = ghaFinal % 360;

                let dCorr = (almData.d || 0) * (decimalMinutes / 60.0) / 60.0;
                const baseDec = (almData.decWhole !== undefined && almData.decWhole !== null) ? almData.decWhole : almData.dec;
                let decFinal = (baseDec || 0) + dCorr;

                let heMeters = parseFloat(obsData.he) || 0;
                if (obsData.unitSystem === 'imperial') heMeters = heMeters * 0.3048;
                const dip = 1.76 * Math.sqrt(heMeters);
                const hsVal = (parseFloat(obsData.hsDeg)||0) + ((parseFloat(obsData.hsMin)||0)/60);
                let ha = hsVal + (parseFloat(obsData.ie || 0)/60) - (dip/60);
                
                // Standard Refraction & Env Correction
                const haAbs = Math.abs(ha);
                const bennettArgDeg = haAbs + (7.31 / (haAbs + 4.4));
                const bennettArgRad = bennettArgDeg * Math.PI / 180;
                const refrStd = (1.0 / Math.tan(bennettArgRad)) / 60; 
                
                let presMb = parseFloat(obsData.pressure) || 1013;
                let tempC = parseFloat(obsData.temperature) || 15;
                if (obsData.unitSystem === 'imperial') {
                    presMb = presMb * 33.8639; 
                    tempC = (tempC - 32) * (5/9); 
                }
                const f = (presMb / 1010) * (283 / (273 + tempC));
                const refrCorrected = refrStd * f;
                const envCorr = refrStd - refrCorrected;

                const corrRefr = -refrStd;
                
                // Semi-Diameter Correction with Limb Logic
                let sdVal = (almData.sd || 0)/60;
                // If Upper Limb ('U'), we subtract SD. Default/Lower ('L') adds SD.
                if (obsData.limb === 'U') {
                    sdVal = -sdVal;
                }
                const corrSD = (isSun || isMoon) ? sdVal : 0;

                let corrPar = 0;
                if (isMoon) {
                    const haRad = Math.abs(ha) * Math.PI / 180; 
                    const hpDeg = (almData.hp || 0) / 60;
                    corrPar = hpDeg * Math.cos(haRad);
                }
                
                const mainCorr = corrRefr + corrSD + corrPar;
                let ho = ha + mainCorr + envCorr;

                // LONGITUDE CALCULATION - STANDARD
                let apLonVal = Math.abs((parseFloat(obsData.apLonDeg)||0) + ((parseFloat(obsData.apLonMin)||0)/60));
                const lonDir = (obsData.apLonDir || 'W').toUpperCase();
                if (lonDir === 'W') apLonVal = -apLonVal;
                
                let lha = ghaFinal + apLonVal;
                while (lha < 0) lha += 360; while (lha >= 360) lha -= 360;

                // LATITUDE CALCULATION - FIXED & ROBUST
                // Ensure we take absolute value of inputs first, then apply sign based solely on Dir selector
                let latVal = Math.abs((parseFloat(obsData.apLatDeg)||0) + ((parseFloat(obsData.apLatMin)||0)/60));
                const latDir = (obsData.apLatDir || 'N').toUpperCase();
                if (latDir === 'S') latVal = -latVal;

                // Solve Triangle
                const trig = NavMath.solveTriangle(latVal, decFinal, lha);
                const intercept = (ho - trig.hc) * 60; 

                return {
                    ghaWhole: almData.ghaWhole, ghaAries: almData.ghaAries, sha: almData.sha,
                    minutes, seconds, ghaInc, vCorr, ghaFinal, apLonVal, lha,
                    decWhole: almData.decWhole, dCorr, decFinal, latVal, hc: trig.hc, intercept, zn: trig.zn,
                    hsVal, dip, ha, mainCorr, corrRefr, corrSD, corrPar, envCorr, ho
                };
            },
            
            identify: (obsData) => {
                const candidates = [];
                if (!obsData.dateTime) return [];
                const date = new Date(obsData.dateTime);
                
                // Calculate Sun position for proximity check
                const sunAlm = NavMath.calculateAlmanac(date, 'Sun');
                const sunRes = sunAlm ? NavMath.reduceSight({...obsData, body: 'Sun'}, sunAlm) : null;
                const sunZn = sunRes ? sunRes.zn : null;
                const sunHc = sunRes ? sunRes.hc : null;
                
                const checkVisibility = (res, name, type) => {
                    // Body must be above horizon (Hc > 0)
                    const isAboveHorizon = res.hc > 0;
                    // Check angular distance from Sun (rough check using Zn difference)
                    let sunDist = null;
                    if (sunZn !== null && sunHc !== null && type !== 'Sun') {
                        let znDiff = Math.abs(res.zn - sunZn);
                        if (znDiff > 180) znDiff = 360 - znDiff;
                        // Approximate angular separation
                        sunDist = Math.sqrt(znDiff * znDiff + (res.hc - sunHc) * (res.hc - sunHc));
                    }
                    const isSunUp = sunHc !== null && sunHc > -6; // Civil twilight or brighter
                    const tooCloseToSun = sunDist !== null && sunDist < 15;
                    
                    return {
                        isAboveHorizon,
                        sunDist: sunDist !== null ? Math.round(sunDist) : null,
                        isSunUp,
                        tooCloseToSun,
                        // Stars/planets only visible during twilight or night (Sun below -6°)
                        // unless they're very bright
                        isDaylight: isSunUp && sunHc > 0,
                    };
                };
                
                CONSTANTS.PLANETS.forEach(p => {
                    const alm = NavMath.calculateAlmanac(date, p);
                    const res = NavMath.reduceSight({...obsData, body: p}, alm);
                    if (Math.abs(res.intercept) <= 120) {
                        const vis = checkVisibility(res, p, 'Planet');
                        candidates.push({ name: p, type: 'Planet', ...res, diff: Math.abs(res.intercept), ...vis });
                    }
                });
                
                Object.keys(CONSTANTS.STARS).forEach(s => {
                    const alm = NavMath.calculateAlmanac(date, 'Star', s);
                    const res = NavMath.reduceSight({...obsData, body: s}, alm);
                     if (Math.abs(res.intercept) <= 120) {
                        const vis = checkVisibility(res, s, 'Star');
                        candidates.push({ name: s, type: 'Star', ...res, diff: Math.abs(res.intercept), ...vis });
                    }
                });
                
                // Sort: visible above horizon first, then by intercept
                return candidates.sort((a, b) => {
                    if (a.isAboveHorizon && !b.isAboveHorizon) return -1;
                    if (!a.isAboveHorizon && b.isAboveHorizon) return 1;
                    return a.diff - b.diff;
                });
            }
        };

        const HO229Modal = ({ lat, lha, dec, onClose }) => {

            const solve = (l, d, lh) => NavMath.solveTriangle(l, d, lh);
            
            // --- FIX: Robust Sign Logic for Summary Calculation ---
            // Determine the actual signed Declination to use for the Base and Next calculations

                                                    const cellDec = sameName ? (calcLat >= 0 ? cellDecMag : -cellDecMag) : (calcLat >= 0 ? -cellDecMag : cellDecMag);

        const PlotterModal = ({ lops, onClose }) => {
            const canvasRef = useRef(null);
            const [cursorPos, setCursorPos] = useState({ lat: null, lon: null });
            const [dims, setDims] = useState({ w: 0, h: 0 });
            const [scale, setScale] = useState(10); 
            const [viewCenter, setViewCenter] = useState(null);

            // Calculate Centroid (Initial Center)
            const calculatedCenter = useMemo(() => {
                const advLops = calculateAdvancedLops(lops);
                if (advLops.length === 0) return { lat: 0, lon: 0 };
                let sumLat = 0, sumLon = 0, count = 0;
                advLops.forEach(lop => { 
                    if(!isNaN(lop.advLat) && !isNaN(lop.advLon)){
                        sumLat += lop.advLat; sumLon += lop.advLon; 
                        count++;
                    }
                });
                if (count === 0) return { lat: 0, lon: 0 };
                return { lat: sumLat / count, lon: sumLon / count };
            }, [lops]);

            // Compute Fix: find LOP intersections and Most Probable Position (MPP)
            const fixData = useMemo(() => {
                const advLops = calculateAdvancedLops(lops);
                if (advLops.length < 2) return null;
                
                const intersections = [];
                // Find all pairwise LOP intersections
                for (let i = 0; i < advLops.length; i++) {
                    for (let j = i + 1; j < advLops.length; j++) {
                        const a = advLops[i];
                        const b = advLops[j];
                        if (isNaN(a.zn) || isNaN(a.intercept) || isNaN(b.zn) || isNaN(b.intercept)) continue;
                        
                        // LOP i: starts at (advLat_i, advLon_i), intercept along Zn_i, then perpendicular
                        // Point on LOP = AP + intercept along Zn, then line perpendicular to Zn
                        const toRad = d => d * Math.PI / 180;
                        const cosLatA = Math.cos(toRad(a.advLat));
                        const cosLatB = Math.cos(toRad(b.advLat));
                        
                        // Intercept point for LOP A
                        const znRadA = toRad(a.zn);
                        const intLatA = a.advLat + (a.intercept / 60) * Math.cos(znRadA);
                        const intLonA = a.advLon + (a.intercept / 60) * Math.sin(znRadA) / Math.max(0.01, cosLatA);
                        
                        // Intercept point for LOP B
                        const znRadB = toRad(b.zn);
                        const intLatB = b.advLat + (b.intercept / 60) * Math.cos(znRadB);
                        const intLonB = b.advLon + (b.intercept / 60) * Math.sin(znRadB) / Math.max(0.01, cosLatB);
                        
                        // LOP direction (perpendicular to Zn)
                        const dirA = toRad(a.zn + 90);
                        const dirB = toRad(b.zn + 90);
                        
                        // Direction vectors in lat/lon minutes
                        const dxA = Math.sin(dirA) / Math.max(0.01, Math.cos(toRad(intLatA)));
                        const dyA = Math.cos(dirA);
                        const dxB = Math.sin(dirB) / Math.max(0.01, Math.cos(toRad(intLatB)));
                        const dyB = Math.cos(dirB);
                        
                        // Solve: intA + t*dirA = intB + s*dirB
                        // dyA*t - dyB*s = intLatB - intLatA
                        // dxA*t - dxB*s = intLonB - intLonA
                        const det = dxA * (-dyB) - (-dxB) * dyA;
                        if (Math.abs(det) < 1e-10) continue; // Parallel LOPs
                        
                        const dLat = intLatB - intLatA;
                        const dLon = intLonB - intLonA;
                        const t = ((-dyB) * dLon - (-dxB) * dLat) / det;
                        
                        const fixLat = intLatA + t * dyA;
                        const fixLon = intLonA + t * dxA;
                        
                        // Sanity check: intersection should be somewhat near the APs
                        const avgLat = (a.advLat + b.advLat) / 2;
                        const avgLon = (a.advLon + b.advLon) / 2;
                        const distFromCenter = Math.sqrt((fixLat - avgLat)**2 + (fixLon - avgLon)**2);
                        if (distFromCenter < 5) { // Within 5 degrees
                            intersections.push({ lat: fixLat, lon: fixLon, lop1: a.body, lop2: b.body });
                        }
                    }
                }
                
                if (intersections.length === 0) return null;
                
                // Most Probable Position = centroid of all intersections
                const mppLat = intersections.reduce((s, p) => s + p.lat, 0) / intersections.length;
                const mppLon = intersections.reduce((s, p) => s + p.lon, 0) / intersections.length;
                
                return { intersections, mpp: { lat: mppLat, lon: mppLon } };
            }, [lops]);

            // Sync View Center on Init
            useEffect(() => {
                if (!viewCenter && calculatedCenter.lat !== 0) {
                    setViewCenter(calculatedCenter);
                }
            }, [calculatedCenter]);

            // Resize Handler
            useEffect(() => {
                const handleResize = () => {
                    setDims({ w: window.innerWidth, h: window.innerHeight - 120 }); // Adjusted for mobile header
                };
                handleResize();
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // Ref to hold state for native event listeners (prevents stale closures and frequent re-binding)
            const stateRef = useRef({ 
                scale, viewCenter, calculatedCenter, dims,
                isDragging: false, startX: 0, startY: 0, 
                startPinchDist: 0, lastScale: 10 
            });

            // Update ref when state changes
            useEffect(() => {
                stateRef.current.scale = scale;
                stateRef.current.viewCenter = viewCenter;
                stateRef.current.calculatedCenter = calculatedCenter;
                stateRef.current.dims = dims;
            }, [scale, viewCenter, calculatedCenter, dims]);
            
            // Reusable LOP logic
            function calculateAdvancedLops(lopsList) {
                if (lopsList.length === 0) return [];
                const latestTime = Math.max(...lopsList.map(lop => new Date(lop.time).getTime()));
                return lopsList.map(lop => {
                    const lopTime = new Date(lop.time).getTime();
                    const hoursDiff = (latestTime - lopTime) / 3600000; 
                    const dist = (parseFloat(lop.speed) || 0) * hoursDiff; 
                    const crsRad = (parseFloat(lop.course) || 0) * Math.PI / 180;
                    const getCoord = (deg, min, oldVal) => {
                        if (oldVal !== undefined && deg === undefined) return parseFloat(oldVal);
                        return (parseFloat(deg) || 0) + ((parseFloat(min) || 0) / 60);
                    };
                    const lat1 = getCoord(lop.apLatDeg, lop.apLatMin, lop.apLat);
                    const lon1 = getCoord(lop.apLonDeg, lop.apLonMin, lop.apLon);
                    const dLat = (dist * Math.cos(crsRad)) / 60;
                    const dLon = (dist * Math.sin(crsRad)) / (60 * Math.max(0.01, Math.cos(lat1 * Math.PI / 180)));
                    const safeLat1 = isNaN(lat1) ? 0 : lat1;
                    const safeLon1 = isNaN(lon1) ? 0 : lon1;
                    return { 
                        ...lop, 
                        origLat: safeLat1, 
                        origLon: safeLon1,
                        advLat: safeLat1 + (isNaN(dLat) ? 0 : dLat), 
                        advLon: safeLon1 + (isNaN(dLon) ? 0 : dLon), 
                        isAdvanced: Math.abs(hoursDiff) > (1/60),
                        zn: parseFloat(lop.zn),
                        intercept: parseFloat(lop.intercept)
                    };
                });
            }

            // Drawing Logic
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || dims.w === 0) return;
                const ctx = canvas.getContext('2d');
                const width = dims.w;
                const height = dims.h;
                
                // Clear
                ctx.fillStyle = '#f8fafc'; ctx.fillRect(0, 0, width, height);

                const center = viewCenter || calculatedCenter;
                if (isNaN(center.lat) || isNaN(center.lon)) return;

                const cx = width / 2;
                const cy = height / 2;
                const midLatRad = (center.lat * Math.PI) / 180;
                const cosLat = Math.max(0.01, Math.cos(midLatRad));

                // Grid
                ctx.strokeStyle = '#e2e8f0'; 
                ctx.lineWidth = 1;
                ctx.font = '12px sans-serif';
                ctx.fillStyle = '#94a3b8';

                // Lat Grid
                const degLatStart = Math.floor(center.lat - (height / 2 / scale / 60));
                const degLatEnd = Math.ceil(center.lat + (height / 2 / scale / 60));
                for (let l = degLatStart; l <= degLatEnd; l++) {
                    const y = cy + (center.lat - l) * 60 * scale;
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
                    ctx.fillText(`${Math.abs(l)}°${l>=0?'N':'S'}`, 5, y - 2);
                }

                // Lon Grid
                const degLonStart = Math.floor(center.lon - (width / 2 / scale / 60 / cosLat));
                const degLonEnd = Math.ceil(center.lon + (width / 2 / scale / 60 / cosLat));
                for (let l = degLonStart; l <= degLonEnd; l++) {
                    const x = cx + (l - center.lon) * 60 * cosLat * scale;
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
                    ctx.fillText(`${Math.abs(l)}°`, x + 2, height - 5);
                }

                // Center Cross (View Center)
                ctx.strokeStyle = '#cbd5e1';
                ctx.beginPath(); ctx.moveTo(cx - 10, cy); ctx.lineTo(cx + 10, cy); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy - 10); ctx.lineTo(cx, cy + 10); ctx.stroke();

                // LOPs
                const advancedLops = calculateAdvancedLops(lops);
                advancedLops.forEach(lop => {
                    if (isNaN(lop.zn) || isNaN(lop.intercept) || isNaN(lop.advLat)) return;

                    let startX, startY;
                    if (lop.isAdvanced) {
                        const origY = cy + (center.lat - lop.origLat) * 60 * scale;
                        const origX = cx + (lop.origLon - center.lon) * 60 * cosLat * scale;
                        ctx.beginPath(); ctx.arc(origX, origY, 3, 0, 2*Math.PI); ctx.fillStyle = '#cbd5e1'; ctx.fill(); 
                        
                        const advY = cy + (center.lat - lop.advLat) * 60 * scale;
                        const advX = cx + (lop.advLon - center.lon) * 60 * cosLat * scale;
                        ctx.beginPath(); ctx.setLineDash([4, 4]); ctx.strokeStyle = '#cbd5e1'; 
                        ctx.moveTo(origX, origY); ctx.lineTo(advX, advY); ctx.stroke(); ctx.setLineDash([]);
                        
                        startX = advX; startY = advY;
                    } else {
                        startX = cx + (lop.advLon - center.lon) * 60 * cosLat * scale;
                        startY = cy + (center.lat - lop.advLat) * 60 * scale;
                    }

                    // AP Dot
                    ctx.beginPath(); ctx.arc(startX, startY, 5, 0, 2*Math.PI); ctx.fillStyle = 'blue'; ctx.fill();
                    
                    // Intercept Line
                    const znRad = lop.zn * Math.PI / 180;
                    const intDX = lop.intercept * scale * Math.sin(znRad);
                    const intDY = -lop.intercept * scale * Math.cos(znRad);
                    const intX = startX + intDX;
                    const intY = startY + intDY;

                    ctx.beginPath(); ctx.setLineDash([2, 2]); ctx.strokeStyle = '#64748b';
                    ctx.moveTo(startX, startY); ctx.lineTo(intX, intY); ctx.stroke(); ctx.setLineDash([]);

                    // LOP Perpendicular
                    const lopLen = 2000 * scale; // Make infinite essentially
                    const lopDX = Math.cos(znRad) * lopLen;
                    const lopDY = Math.sin(znRad) * lopLen;

                    ctx.beginPath(); ctx.strokeStyle = lop.isAdvanced ? '#ef4444' : '#dc2626'; 
                    ctx.lineWidth = 2;
                    ctx.moveTo(intX - lopDX, intY - lopDY);
                    ctx.lineTo(intX + lopDX, intY + lopDY);
                    ctx.stroke();

                    // NEW: Draw Label along LOP
                    ctx.fillStyle = 'black';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = 'white'; // Stroke for readability over lines
                    ctx.lineJoin = 'round';

                    // Offset label along the positive LOP vector (Zn + 90)
                    const labelOffset = 60; 
                    const labelX = intX + Math.cos(znRad) * labelOffset;
                    const labelY = intY + Math.sin(znRad) * labelOffset;
                    
                    ctx.strokeText(lop.body, labelX, labelY);
                    ctx.fillText(lop.body, labelX, labelY);
                });

                // Draw Fix Intersections & MPP
                if (fixData) {
                    // Draw intersection points (small diamonds)
                    fixData.intersections.forEach(pt => {
                        const px = cx + (pt.lon - center.lon) * 60 * cosLat * scale;
                        const py = cy + (center.lat - pt.lat) * 60 * scale;
                        const sz = 6;
                        ctx.beginPath();
                        ctx.moveTo(px, py - sz); ctx.lineTo(px + sz, py); ctx.lineTo(px, py + sz); ctx.lineTo(px - sz, py);
                        ctx.closePath();
                        ctx.fillStyle = '#f59e0b'; ctx.fill();
                        ctx.strokeStyle = '#92400e'; ctx.lineWidth = 1; ctx.stroke();
                    });
                    
                    // Draw MPP (Most Probable Position) — larger star marker
                    const mppX = cx + (fixData.mpp.lon - center.lon) * 60 * cosLat * scale;
                    const mppY = cy + (center.lat - fixData.mpp.lat) * 60 * scale;
                    
                    // Star shape
                    const drawStar = (x, y, r1, r2, points) => {
                        ctx.beginPath();
                        for (let i = 0; i < points * 2; i++) {
                            const r = i % 2 === 0 ? r1 : r2;
                            const angle = (Math.PI / points) * i - Math.PI / 2;
                            const px = x + r * Math.cos(angle);
                            const py = y + r * Math.sin(angle);
                            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                        }
                        ctx.closePath();
                    };
                    
                    drawStar(mppX, mppY, 12, 5, 5);
                    ctx.fillStyle = '#dc2626'; ctx.fill();
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                    
                    // Label
                    ctx.font = 'bold 11px sans-serif';
                    ctx.fillStyle = '#dc2626';
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
                    ctx.strokeText('FIX', mppX + 14, mppY + 4);
                    ctx.fillText('FIX', mppX + 14, mppY + 4);
                }

                // Draw Compass Rose (top-left area)
                const roseX = 60;
                const roseY = 60;
                const roseR = 35;
                ctx.save();
                ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(roseX, roseY, roseR, 0, 2*Math.PI); ctx.stroke();
                // Cardinal directions
                const cardinals = [{label:'N', angle:0}, {label:'E', angle:90}, {label:'S', angle:180}, {label:'W', angle:270}];
                ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                cardinals.forEach(c => {
                    const a = c.angle * Math.PI / 180;
                    // Tick
                    const ix = roseX + Math.sin(a) * (roseR - 6);
                    const iy = roseY - Math.cos(a) * (roseR - 6);
                    const ox = roseX + Math.sin(a) * roseR;
                    const oy = roseY - Math.cos(a) * roseR;
                    ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(ox, oy); ctx.stroke();
                    // Label
                    const lx = roseX + Math.sin(a) * (roseR + 12);
                    const ly = roseY - Math.cos(a) * (roseR + 12);
                    ctx.fillStyle = '#334155'; ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
                    ctx.strokeText(c.label, lx, ly); ctx.fillText(c.label, lx, ly);
                });
                // North arrow
                ctx.beginPath(); ctx.fillStyle = '#dc2626';
                ctx.moveTo(roseX, roseY - roseR + 8); ctx.lineTo(roseX - 4, roseY - 6); ctx.lineTo(roseX + 4, roseY - 6);
                ctx.closePath(); ctx.fill();
                ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
                ctx.restore();
                
                // Draw Scale Bar (bottom-left)
                const scaleBarNm = 1; // 1 nautical mile = 1 arcminute of latitude
                const scaleBarPx = scaleBarNm * 60 * scale / 60; // 1 nm = 1' lat, scale px per arcmin = scale
                const barLen = scale; // pixels for 1 nm
                if (barLen > 10 && barLen < width / 2) {
                    const barX = 20;
                    const barY = height - 25;
                    ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(barX, barY); ctx.lineTo(barX + barLen, barY); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(barX, barY - 4); ctx.lineTo(barX, barY + 4); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(barX + barLen, barY - 4); ctx.lineTo(barX + barLen, barY + 4); ctx.stroke();
                    ctx.font = '11px sans-serif'; ctx.fillStyle = '#334155'; ctx.textAlign = 'center';
                    ctx.fillText('1 nm', barX + barLen / 2, barY - 8);
                    ctx.textAlign = 'start';
                }
            }, [lops, viewCenter, calculatedCenter, dims, scale, fixData]);

            const handleZoomIn = () => setScale(prev => Math.min(prev * 1.2, 100));
            const handleZoomOut = () => setScale(prev => Math.max(prev / 1.2, 1));

            // Native Event Listeners for Interaction (Passive: False required for mobile pinch)
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const getCenter = () => stateRef.current.viewCenter || stateRef.current.calculatedCenter;
                const getCosLat = (lat) => Math.max(0.01, Math.cos(lat * Math.PI / 180));

                const handleWheel = (e) => {
                    e.preventDefault();
                    const delta = -Math.sign(e.deltaY);
                    const factor = 1.1;
                    const currentScale = stateRef.current.scale;
                    let newScale = delta > 0 ? currentScale * factor : currentScale / factor;
                    newScale = Math.max(1, Math.min(100, newScale));
                    setScale(newScale);
                };

                const handleTouchMove = (e) => {
                    e.preventDefault(); // Critical for preventing page scroll on mobile
                    const { scale, dims } = stateRef.current;
                    
                    if (e.touches.length === 1 && stateRef.current.isDragging) {
                        const clientX = e.touches[0].clientX;
                        const clientY = e.touches[0].clientY;
                        
                        const dx = clientX - stateRef.current.startX;
                        const dy = clientY - stateRef.current.startY;
                        
                        const center = getCenter();
                        const cosLat = getCosLat(center.lat);

                        const dLat = dy / scale / 60; 
                        const dLon = -dx / scale / 60 / cosLat; // Drag right -> Move view Left (West)

                        setViewCenter({ lat: center.lat + dLat, lon: center.lon + dLon });
                        
                        stateRef.current.startX = clientX;
                        stateRef.current.startY = clientY;
                        
                        // Cursor Update Logic
                        const dLatMinCursor = -((clientY - canvas.getBoundingClientRect().top - dims.h/2) / scale); 
                        const dLonMinCursor = (clientX - canvas.getBoundingClientRect().left - dims.w/2) / (scale * Math.max(0.01, cosLat));
                        setCursorPos({ 
                            lat: center.lat + (dLatMinCursor / 60), 
                            lon: center.lon + (dLonMinCursor / 60) 
                        });

                    } else if (e.touches.length === 2) {
                        const dist = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        if (stateRef.current.startPinchDist > 0) {
                            const ratio = dist / stateRef.current.startPinchDist;
                            const newScale = Math.max(1, Math.min(100, stateRef.current.lastScale * ratio));
                            setScale(newScale);
                        }
                    }
                };

                // Add non-passive listeners
                canvas.addEventListener('wheel', handleWheel, { passive: false });
                canvas.addEventListener('touchmove', handleTouchMove, { passive: false });

                return () => {
                    canvas.removeEventListener('wheel', handleWheel);
                    canvas.removeEventListener('touchmove', handleTouchMove);
                };
            }, []);

            // React Event Handlers (Start/End don't need passive false)
            const handlePointerDown = (clientX, clientY) => {
                stateRef.current.isDragging = true;
                stateRef.current.startX = clientX;
                stateRef.current.startY = clientY;
            };

            const handlePointerMove = (clientX, clientY) => {
                if (!stateRef.current.isDragging) return;
                const { scale } = stateRef.current;
                const dx = clientX - stateRef.current.startX;
                const dy = clientY - stateRef.current.startY;
                const center = stateRef.current.viewCenter || stateRef.current.calculatedCenter;
                const cosLat = Math.max(0.01, Math.cos(center.lat * Math.PI / 180));
                
                const dLat = dy / scale / 60; 
                const dLon = -dx / scale / 60 / cosLat;
                setViewCenter({ lat: center.lat + dLat, lon: center.lon + dLon });
                stateRef.current.startX = clientX;
                stateRef.current.startY = clientY;
            };

            const handleTouchStart = (e) => {
                if (e.touches.length === 1) {
                    handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    stateRef.current.startPinchDist = dist;
                    stateRef.current.lastScale = stateRef.current.scale;
                }
            };

            const updateCursorReadout = (clientX, clientY) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const center = stateRef.current.viewCenter || stateRef.current.calculatedCenter;
                const cosLat = Math.max(0.01, Math.cos(center.lat * Math.PI / 180));
                const dLatMin = -((clientY - rect.top - dims.h/2) / scale); 
                const dLonMin = (clientX - rect.left - dims.w/2) / (scale * Math.max(0.01, cosLat));
                setCursorPos({ lat: center.lat + (dLatMin / 60), lon: center.lon + (dLonMin / 60) });
            };

            return (
                <div className="fixed inset-0 bg-slate-900/95 z-50 flex flex-col">
                    {/* Header */}
                    <div className="bg-white p-3 flex justify-between items-center shadow z-10">
                        <div className="flex items-center gap-3">
                             <div className="flex flex-col">
                                <h2 className="font-bold text-lg leading-none">Plotter</h2>
                                <button 
                                    onClick={() => setViewCenter(calculatedCenter)}
                                    className="text-xs text-blue-600 font-bold mt-1 bg-blue-50 px-2 py-1 rounded border border-blue-100"
                                >
                                    RE-CENTER
                                </button>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                             {fixData && fixData.mpp && (
                                <div className="text-right font-mono hidden md:block">
                                    <div className="text-xs text-red-500 uppercase font-bold">FIX ({fixData.intersections.length} int.)</div>
                                    <div className="text-red-700 font-bold">
                                        {Formatters.lat(fixData.mpp.lat)} {Formatters.gha(Math.abs(fixData.mpp.lon))}{fixData.mpp.lon >= 0 ? 'E' : 'W'}
                                    </div>
                                </div>
                             )}
                             <div className="text-right font-mono hidden md:block">
                                <div className="text-xs text-slate-400">CURSOR</div>
                                <div className="text-blue-600 font-bold">
                                    {cursorPos.lat !== null ? `${Formatters.lat(cursorPos.lat)} ${Formatters.inputDisplay(cursorPos.lon)}` : '--'}
                                </div>
                            </div>
                            <button onClick={onClose} className="p-2 bg-slate-100 rounded-full hover:bg-slate-200"><i data-lucide="x" className="w-6 h-6"></i></button>
                        </div>
                    </div>

                    {/* Canvas Area */}
                    <div className="flex-grow relative overflow-hidden bg-slate-200 touch-none">
                        <canvas 
                            ref={canvasRef} 
                            width={dims.w} 
                            height={dims.h} 
                            className="absolute top-0 left-0 cursor-move"
                            onMouseDown={(e) => handlePointerDown(e.clientX, e.clientY)}
                            onMouseMove={(e) => { 
                                handlePointerMove(e.clientX, e.clientY); 
                                updateCursorReadout(e.clientX, e.clientY);
                            }}
                            onMouseUp={() => stateRef.current.isDragging = false}
                            onMouseLeave={() => stateRef.current.isDragging = false}
                            onTouchStart={handleTouchStart}
                            onTouchEnd={() => stateRef.current.isDragging = false}
                            /* TouchMove handled natively for passive: false */
                        />
                        
                        {/* Mobile Overlay Controls */}
                        <div className="absolute bottom-6 right-6 flex flex-col gap-2 pointer-events-none">
                            <div className="bg-white/90 backdrop-blur p-2 rounded-lg shadow-lg border border-slate-200 pointer-events-auto flex flex-col gap-4">
                                <button onClick={handleZoomIn} className="p-3 bg-slate-100 hover:bg-slate-200 rounded-lg font-bold text-slate-700 active:bg-blue-100"><i data-lucide="plus" className="w-6 h-6"></i></button>
                                <div className="text-center text-xs font-mono text-slate-400 font-bold py-1 border-t border-b">{scale.toFixed(1)}</div>
                                <button onClick={handleZoomOut} className="p-3 bg-slate-100 hover:bg-slate-200 rounded-lg font-bold text-slate-700 active:bg-blue-100"><i data-lucide="minus" className="w-6 h-6"></i></button>
                            </div>
                        </div>
                        
                         {/* Mobile Cursor Readout Overlay */}
                         <div className="absolute top-4 left-4 pointer-events-none md:hidden">
                            <div className="bg-white/80 backdrop-blur px-3 py-2 rounded shadow border border-slate-200 text-xs font-mono font-bold text-slate-700">
                                {fixData && fixData.mpp && (
                                    <div className="text-red-700 border-b border-slate-300 pb-1 mb-1">
                                        FIX: {Formatters.lat(fixData.mpp.lat)} {Formatters.gha(Math.abs(fixData.mpp.lon))}{fixData.mpp.lon >= 0 ? 'E' : 'W'}
                                    </div>
                                )}
                                {cursorPos.lat !== null ? (
                                    <>
                                        <div>{Formatters.lat(cursorPos.lat)}</div>
                                        <div>{Formatters.inputDisplay(cursorPos.lon)}</div>
                                    </>
                                ) : "Touch map"}
                            </div>
                         </div>
                    </div>
                </div>
            );
        };

        const AlmanacModal = ({ onClose, onSelectData }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [isRunning, setIsRunning] = useState(true);
            const [selectedBody, setSelectedBody] = useState('Sun');
            const [selectedStar, setSelectedStar] = useState('Aldebaran');
            const [selectedLimb, setSelectedLimb] = useState('L'); 

            useEffect(() => {
                let interval;
                if (isRunning) interval = setInterval(() => setCurrentDate(new Date()), 1000);
                return () => clearInterval(interval);
            }, [isRunning]);

            const handleDateChange = (e) => {
                const d = new Date(e.target.value + 'Z');
                if (!isNaN(d)) {
                    setCurrentDate(d);
                    setIsRunning(false);
                }
            };
            
            const handleMark = () => { setIsRunning(false); setCurrentDate(new Date()); };
            
            const data = useMemo(() => NavMath.calculateAlmanac(currentDate, selectedBody, selectedStar), [currentDate, selectedBody, selectedStar]);
            
            const isStarMode = selectedBody === 'Aries' || selectedBody === 'Star';
            const toLocalISO = (date) => { return date.toISOString().slice(0, 19); };

            return (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-2 md:p-4">
                    <div className="bg-white modal-content rounded-xl w-full max-w-4xl shadow-2xl border border-slate-300 overflow-hidden flex flex-col max-h-[98vh]">
                        <div className="bg-slate-900 text-white p-3 md:p-4 flex justify-between items-center shrink-0">
                            <div className="flex items-center gap-2">
                                <img src="https://xaxero.com/tools/logoim.png" alt="Xaxero" className="h-6 w-auto" />
                                <h2 className="font-bold text-lg ml-2">Almanac</h2>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-white/20 rounded"><i data-lucide="x" className="w-6 h-6"></i></button>
                        </div>

                                    <button onClick={() => setSelectedBody('Sun')} className={`px-4 py-2 rounded font-bold ${selectedBody === 'Sun' ? 'bg-amber-500 text-white' : 'bg-white border'}`}>Sun</button>
                                    <button onClick={() => setSelectedBody('Moon')} className={`px-4 py-2 rounded font-bold ${selectedBody === 'Moon' ? 'bg-slate-600 text-white' : 'bg-white border'}`}>Moon</button>
                                    {CONSTANTS.PLANETS.map(p => <button key={p} onClick={() => setSelectedBody(p)} className={`px-3 py-2 rounded text-sm font-bold ${selectedBody === p ? 'bg-blue-600 text-white' : 'bg-white border'}`}>{p.substring(0,3)}</button>)}
                                    <button onClick={() => setSelectedBody('Aries')} className={`px-4 py-2 rounded font-bold ${selectedBody === 'Aries' ? 'bg-teal-600 text-white' : 'bg-white border'}`}>Stars</button>
                                </div>
                                {['Sun', 'Moon'].includes(selectedBody) && (
                                    <div className="flex gap-1 justify-center lg:justify-end">
                                        <button onClick={() => setSelectedLimb('L')} className={`px-2 py-1 text-xs rounded font-bold border ${selectedLimb === 'L' ? 'bg-slate-700 text-white' : 'bg-white text-slate-600'}`}>Lower Limb</button>
                                        <button onClick={() => setSelectedLimb('U')} className={`px-2 py-1 text-xs rounded font-bold border ${selectedLimb === 'U' ? 'bg-slate-700 text-white' : 'bg-white text-slate-600'}`}>Upper Limb</button>
                                    </div>

                        </div>
                        {isStarMode && (<div className="p-3 bg-slate-50 border-b flex justify-center"><select value={selectedStar} onChange={(e) => { setSelectedStar(e.target.value); setSelectedBody('Star'); }} className="bg-white border rounded px-4 py-3 font-medium w-full max-w-xs text-base">{NAV_STARS_LIST.map(s => <option key={s} value={s}>{s}</option>)}</select></div>)}
                        <div className="flex-grow overflow-y-auto p-4 md:p-6">
                            {data ? (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-2 gap-4 text-center">
                                        <div className="p-4 bg-slate-50 rounded border">
                                            <div className="text-xs text-slate-400 uppercase font-bold">{isStarMode ? 'GHA Aries' : 'GHA Body'}</div>
                                            <div className="text-3xl font-mono font-bold text-slate-800">{isStarMode ? Formatters.gha(data.ghaAries) : Formatters.gha(data.gha)}</div>
                                        </div>
                                        <div className="p-4 bg-slate-50 rounded border">
                                            <div className="text-xs text-slate-400 uppercase font-bold">Dec</div>
                                            <div className="text-3xl font-mono font-bold text-slate-800">{Formatters.dec(data.dec)}</div>

                                        <div className="bg-white p-2 border rounded"><div className="text-slate-400 text-xs font-bold">v</div><div className="font-mono font-bold text-base">{Formatters.decimal(data.v, 1)}'</div></div>
                                        <div className="bg-white p-2 border rounded"><div className="text-slate-400 text-xs font-bold">d</div><div className="font-mono font-bold text-base">{Formatters.decimal(data.d, 1)}'</div></div>
                                        <div className="bg-white p-2 border rounded"><div className="text-slate-400 text-xs font-bold">SD</div><div className="font-mono font-bold text-base">{data.sd ? Formatters.decimal(data.sd, 1) : '-'}</div></div>
                                        <div className="bg-white p-2 border rounded"><div className="text-slate-400 text-xs font-bold">HP</div><div className="font-mono font-bold text-base">{data.hp ? Formatters.decimal(data.hp, 1) : '-'}</div></div>
                                    </div>
                                    {isStarMode && (<div className="bg-blue-50 p-3 rounded border border-blue-100 text-center"><div className="text-xs text-blue-500 font-bold mb-1">STAR DATA</div><div className="flex justify-around"><div>SHA: <span className="font-mono font-bold">{Formatters.gha(data.sha)}</span></div><div>Dec: <span className="font-mono font-bold">{Formatters.dec(data.dec)}</span></div></div></div>)}
                                </div>
                            ) : <div className="text-center p-8 text-slate-400">Calculating...</div>}
