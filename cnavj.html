                        <div className="p-4 border-t bg-slate-50 flex justify-end pb-8 md:pb-4">
                            <button onClick={() => { if(!data)return; onSelectData({ body: isStarMode ? selectedStar : selectedBody, time: currentDate, ghaWhole: isStarMode ? data.ghaAries : data.gha, decWhole: data.dec, v: data.v, d: data.d, sd: data.sd, hp: data.hp, sha: data.sha, ghaAries: data.ghaAries, limb: selectedLimb }); onClose(); }} disabled={!data} className="w-full md:w-auto bg-green-600 hover:bg-green-500 text-white px-6 py-4 md:py-3 rounded-lg font-bold shadow-lg flex items-center justify-center gap-2 disabled:opacity-50 active:scale-95 transition-transform"><i data-lucide="check-circle" className="w-5 h-5"></i> USE DATA</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // MODULE 4: FORM SUB-COMPONENTS
        // ==========================================

        const Header = ({ onReset, isRedMode, setIsRedMode, isStudyMode, setIsStudyMode }) => (
            <header className="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-30">
                <div className="max-w-6xl mx-auto flex justify-between items-center">
                    <div className="flex items-center gap-3">
                        <img src="https://xaxero.com/tools/logoim.png" alt="Xaxero" className="h-8 md:h-10 w-auto" />
                        <div><h1 className="text-lg md:text-xl font-bold leading-none">HO-229</h1><div className="text-[10px] md:text-xs text-slate-400">SIGHT REDUCTION FORM</div></div>
                    </div>
                    <div className="flex gap-2">
                        <button onClick={onReset} className="text-xs border px-2 py-2 md:py-1 rounded border-red-600 text-red-400 hover:text-white hover:bg-red-900">NEW</button>
                        <button onClick={() => setIsStudyMode(!isStudyMode)} className={`text-xs border px-3 py-2 md:py-1 rounded border-purple-500 ${isStudyMode ? 'bg-purple-600 text-white' : 'text-purple-400 hover:text-white hover:bg-purple-900'}`}>STUDY</button>
                        <button onClick={() => setIsRedMode(!isRedMode)} className="text-xs border px-3 py-2 md:py-1 rounded border-slate-600 text-slate-400 hover:text-white">{isRedMode ? 'DAY' : 'NIGHT'}</button>
                    </div>
                </div>
            </header>
        );

        const ObservationCard = ({ obsData, setObsData, onOpenAlmanac, onIdentify, isStudyMode, onShowHelp }) => {
            const handleUnitToggle = () => {
                // Switch between Metric (mb/C) and Imperial (inHg/F)
                if (obsData.unitSystem === 'metric') {
                    // Convert to Imperial
                    const p = parseFloat(obsData.pressure);
                    const t = parseFloat(obsData.temperature);
                    const newP = !isNaN(p) ? (p / 33.8639).toFixed(2) : '';
                    const newT = !isNaN(t) ? ((t * 9/5) + 32).toFixed(1) : '';
                    setObsData({...obsData, unitSystem: 'imperial', pressure: newP, temperature: newT});
                } else {
                    // Convert to Metric
                    const p = parseFloat(obsData.pressure);
                    const t = parseFloat(obsData.temperature);
                    const newP = !isNaN(p) ? (p * 33.8639).toFixed(0) : '';
                    const newT = !isNaN(t) ? ((t - 32) * 5/9).toFixed(1) : '';
                    setObsData({...obsData, unitSystem: 'metric', pressure: newP, temperature: newT});
                }
            };

            // Strict positive input handler
            const handlePosInput = (field, val) => {
                if (val === '' || (!isNaN(val) && parseFloat(val) >= 0)) {
                    setObsData(prev => ({ ...prev, [field]: val }));
                }
            };

            return (
                <div className="card bg-white rounded-lg shadow border border-slate-200 overflow-hidden">
                    <div className="bg-slate-50 p-3 border-b border-slate-200 font-bold text-slate-700 flex justify-between"><span>1. Observation & Ship State</span><i data-lucide="map-pin" className="w-5 h-5 text-slate-400"></i></div>
                    <div className="p-4 grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="space-y-3">
                            <label className="block text-xs font-bold text-slate-500 uppercase flex items-center">Body <HelpIcon helpKey="body" isVisible={isStudyMode} onShow={onShowHelp} /></label>
                            {obsData.body ? (
                                <div className="flex gap-2">
                                    <div className="flex-grow flex items-center gap-2 bg-green-50 border border-green-200 p-2 rounded text-green-800 font-bold">
                                        <i data-lucide="check" className="w-4 h-4"></i> 
                                        {obsData.body}
                                        {['Sun', 'Moon'].includes(obsData.body) && obsData.limb && (
                                            <span className="text-[10px] bg-slate-200 text-slate-600 px-1 rounded ml-1">{obsData.limb}</span>
                                        )}
                                        <button onClick={onOpenAlmanac} className="ml-auto text-xs bg-white border border-green-300 px-3 py-2 rounded hover:bg-green-100">CHANGE</button>
                                    </div>
                                    <button onClick={onIdentify} className="w-14 bg-purple-100 hover:bg-purple-200 text-purple-700 font-bold rounded flex items-center justify-center border border-purple-300" title="Identify Body (Star Finder)"><i data-lucide="stars" className="w-6 h-6"></i></button>
                                </div>
                            ) : (
                                <div className="flex gap-2">
                                    <button onClick={onOpenAlmanac} className="flex-grow bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-4 rounded flex items-center justify-center gap-2 shadow active:scale-95 transition-transform"><i data-lucide="search" className="w-5 h-5"></i> OPEN ALMANAC</button>
                                    <button onClick={onIdentify} className="w-14 bg-purple-100 hover:bg-purple-200 text-purple-700 font-bold rounded flex items-center justify-center border border-purple-300" title="Identify Body (Star Finder)"><i data-lucide="stars" className="w-6 h-6"></i></button>
                                </div>
                            )}
                            
                            <div className="mt-1">
                                <div className="text-[10px] text-slate-400 mb-1">Observation Time (UTC)</div>
                                <input type="datetime-local" step="1" className="w-full border rounded p-2 font-mono text-base" value={obsData.dateTime ? obsData.dateTime.substring(0, 19) : ''} onChange={e => setObsData(prev => ({ ...prev, dateTime: new Date(e.target.value + 'Z').toISOString() }))} />
                            </div>
                        </div>
                        
                        <div className="space-y-2">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-1">
                                    <label className="block text-xs font-bold text-slate-500 uppercase flex items-center">Sextant Altitude <HelpIcon helpKey="hs" isVisible={isStudyMode} onShow={onShowHelp} /></label>
                                    <div className="flex gap-1">
                                        <input type="number" className="w-1/2 border rounded p-2 font-mono text-right" placeholder="Deg" value={obsData.hsDeg} onChange={e => setObsData({...obsData, hsDeg: e.target.value})} />
                                        <input type="number" className="w-1/2 border rounded p-2 font-mono text-right" placeholder="Min" value={obsData.hsMin} onChange={e => setObsData({...obsData, hsMin: e.target.value})} />
                                    </div>
                                </div>
                                <div className="space-y-1">
                                    <label className="block text-xs font-bold text-slate-500 uppercase">Corrections</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><div className="text-[9px] text-slate-400 flex items-center">Index Err <HelpIcon helpKey="ie" isVisible={isStudyMode} onShow={onShowHelp} /></div><input type="number" className="w-full border rounded p-2 font-mono text-right" placeholder="IE" value={obsData.ie} onChange={e => setObsData({...obsData, ie: e.target.value})} /></div>
                                        <div><div className="text-[9px] text-slate-400 flex items-center">Ht Eye ({obsData.unitSystem === 'imperial' ? 'ft' : 'm'}) <HelpIcon helpKey="he" isVisible={isStudyMode} onShow={onShowHelp} /></div><input type="number" className="w-full border rounded p-2 font-mono text-right" placeholder="HE" value={obsData.he} onChange={e => setObsData({...obsData, he: e.target.value})} /></div>
                                    </div>
                                </div>
                            </div>
                            
                            {/* NEW: Env Corrections */}
                            <div className="pt-2 border-t border-dashed">
                                <div className="flex justify-between items-center mb-1">
                                    <label className="text-xs font-bold text-slate-500 uppercase flex items-center">Atmosphere <HelpIcon helpKey="envCorr" isVisible={isStudyMode} onShow={onShowHelp} /></label>
                                    <button onClick={handleUnitToggle} className="text-[10px] bg-slate-100 px-2 py-0.5 rounded border hover:bg-slate-200 text-slate-600 font-bold">{obsData.unitSystem === 'metric' ? 'METRIC' : 'IMPERIAL'}</button>
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <div>
                                        <div className="text-[9px] text-slate-400">Pressure ({obsData.unitSystem === 'metric' ? 'hPa' : 'inHg'})</div>
                                        <input type="number" step="0.1" className="w-full border rounded p-2 font-mono text-right text-sm" value={obsData.pressure} onChange={e => setObsData({...obsData, pressure: e.target.value})} />
                                    </div>
                                    <div>
                                        <div className="text-[9px] text-slate-400">Temp ({obsData.unitSystem === 'metric' ? '°C' : '°F'})</div>
                                        <input type="number" step="0.1" className="w-full border rounded p-2 font-mono text-right text-sm" value={obsData.temperature} onChange={e => setObsData({...obsData, temperature: e.target.value})} />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="space-y-2">
                            <label className="block text-xs font-bold text-slate-500 uppercase flex items-center">Assumed Position <HelpIcon helpKey="ap" isVisible={isStudyMode} onShow={onShowHelp} /></label>
                            <div className="space-y-2">
                                <div className="flex gap-1 items-center">
                                    <span className="text-xs w-8 text-slate-400 font-bold">LAT</span>
                                    <input type="number" min="0" className="w-16 border rounded p-2 font-mono text-right" placeholder="Deg" value={obsData.apLatDeg} onChange={e => handlePosInput('apLatDeg', e.target.value)} />
                                    <input type="number" min="0" className="w-24 border rounded p-2 font-mono text-right" placeholder="Min" value={obsData.apLatMin} onChange={e => handlePosInput('apLatMin', e.target.value)} />
                                    <select className="bg-slate-50 border rounded text-base font-bold px-2 py-2" value={obsData.apLatDir || 'N'} onChange={e => setObsData({...obsData, apLatDir: e.target.value})}>
                                        <option value="N">N</option>
                                        <option value="S">S</option>
                                    </select>
                                </div>
                                <div className="flex gap-1 items-center">
                                    <span className="text-xs w-8 text-slate-400 font-bold">LON</span>
                                    <input type="number" min="0" className="w-16 border rounded p-2 font-mono text-right" placeholder="Deg" value={obsData.apLonDeg} onChange={e => handlePosInput('apLonDeg', e.target.value)} />
                                    <input type="number" min="0" className="w-24 border rounded p-2 font-mono text-right" placeholder="Min" value={obsData.apLonMin} onChange={e => handlePosInput('apLonMin', e.target.value)} />
                                    <select className="bg-slate-50 border rounded text-base font-bold px-2 py-2" value={obsData.apLonDir || 'W'} onChange={e => setObsData({...obsData, apLonDir: e.target.value})}>
                                        <option value="W">W</option>
                                        <option value="E">E</option>
                                    </select>
                                </div>
                            </div>
                            
                             <div className="pt-2 border-t border-dashed mt-2">
                                <label className="block text-xs font-bold text-slate-500 uppercase flex items-center mb-1">Dead Reckoning</label>
                                <div className="grid grid-cols-2 gap-2">
                                    <div><div className="text-[9px] text-slate-400">Course (T)</div><input type="number" className="w-full border rounded p-2 font-mono text-sm" placeholder="Deg" value={obsData.course} onChange={e => setObsData({...obsData, course: e.target.value})} /></div>
                                    <div><div className="text-[9px] text-slate-400">Speed (kts)</div><input type="number" className="w-full border rounded p-2 font-mono text-sm" placeholder="Kts" value={obsData.speed} onChange={e => setObsData({...obsData, speed: e.target.value})} /></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const WorksheetCard = ({ obsData, setObsData, almData, onSave, isStudyMode, onShowHelp, onShowHO229, setModalConfig }) => {
            const r = useMemo(() => NavMath.reduceSight(obsData, almData), [obsData, almData]);
            
            const isStar = obsData.body && (CONSTANTS.STARS[obsData.body] || obsData.body === 'Aries');
            const isMoon = obsData.body === 'Moon';

            // Check if LHA and Lat are close enough to integers to allow Table Lookup
            const isWholeLHA = Math.abs(r.lha - Math.round(r.lha)) < 0.005; 
            const isWholeLat = Math.abs(r.latVal - Math.round(r.latVal)) < 0.005;
            const canShowTable = isWholeLHA && isWholeLat;

            const handleSetAP = () => {
                // Logic to set AP compatible with HO229
                // Lat = Nearest Whole Degree to Current Input (usually DR)
                const currentLatVal = (parseFloat(obsData.apLatDeg)||0) + ((parseFloat(obsData.apLatMin)||0)/60);
                const currentLonVal = (parseFloat(obsData.apLonDeg)||0) + ((parseFloat(obsData.apLonMin)||0)/60);
                const newLatDeg = Math.round(currentLatVal);
                
                // Lon = Adjusted so LHA is Integer
                const gha = r.ghaFinal;
                const ghaMin = (gha - Math.floor(gha)) * 60;
                
                let newLonMin = 0;
                let newLonDeg = parseFloat(obsData.apLonDeg) || 0;
                const lonDir = obsData.apLonDir;
                
                if (lonDir === 'W') {
                    newLonMin = ghaMin;
                } else {
                    newLonMin = 60 - ghaMin;
                }
                
                // Check for rollover if minutes round up to 60
                if (parseFloat(newLonMin.toFixed(1)) >= 60.0) {
                    newLonMin = 0;
                    newLonDeg += 1;
                }
                
                // Proximity check: warn if new AP is more than 60nm from input position
                const newLonVal = newLonDeg + newLonMin / 60;
                const latDiff = Math.abs(newLatDeg - currentLatVal) * 60; // nm
                const lonDiff = Math.abs(newLonVal - currentLonVal) * 60 * Math.cos((currentLatVal || 0) * Math.PI / 180); // nm
                const totalDist = Math.sqrt(latDiff * latDiff + lonDiff * lonDiff);
                
                if (totalDist > 60 && currentLatVal !== 0 && currentLonVal !== 0) {
                    setModalConfig({
                        type: 'confirm',
                        message: `Warning: The computed AP is ${Math.round(totalDist)} nm from your input position. This is unusually far. The AP should be near your DR. Continue anyway?`,
                        onConfirm: () => {
                            setObsData(prev => ({
                                ...prev,
                                apLatDeg: newLatDeg,
                                apLatMin: '0.0',
                                apLonDeg: newLonDeg,
                                apLonMin: newLonMin.toFixed(1)
                            }));
                        }
                    });
                } else {
                    setObsData(prev => ({
                        ...prev,
                        apLatDeg: newLatDeg,
                        apLatMin: '0.0',
                        apLonDeg: newLonDeg,
                        apLonMin: newLonMin.toFixed(1)
                    }));
                }
            };

            return (
                <div className="card bg-white rounded-lg shadow border border-slate-200 overflow-hidden">
                    <div className="bg-slate-50 p-3 border-b border-slate-200 font-bold text-slate-700 flex justify-between"><span>2. Sight Reduction Worksheet</span><i data-lucide="clipboard" className="w-5 h-5 text-slate-400"></i></div>
                    <div className="p-4 grid grid-cols-1 md:grid-cols-3 gap-8 text-sm">
                        {/* Col 1: Altitude */}
                        <div>
                            <div className="font-bold text-slate-800 border-b-2 border-slate-300 mb-2 pb-1 uppercase">Altitude (Vert)</div>
                            <div className="form-row"><span className="form-label">Sextant Alt (Hs) <HelpIcon helpKey="hs" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val">{Formatters.angle(r.hsVal)}</span></div>
                            <div className="form-row"><span className="form-label">Index Error (IE) <HelpIcon helpKey="ie" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val">{obsData.ie}'</span></div>
                            <div className="form-row"><span className="form-label">Dip (He {obsData.he}{obsData.unitSystem === 'imperial' ? 'ft' : 'm'}) <HelpIcon helpKey="he" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val">-{Formatters.decimal(r.dip, 1)}'</span></div>
                            <div className="form-row bg-slate-50"><span className="form-label font-bold">Apparent Alt (Ha) <HelpIcon helpKey="ha" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val text-blue-800">{Formatters.angle(r.ha)}</span></div>
                            <div className="form-row"><span className="form-label">Main Corr (Ref/SD{isMoon ? '/PA' : ''}) <HelpIcon helpKey="mainCorr" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val">{r.mainCorr >= 0 ? '+' : ''}{Formatters.decimal(r.mainCorr*60, 1)}'</span></div>
                            <div className="form-row"><span className="form-label text-slate-500">Env. Corr (T/P) <HelpIcon helpKey="envCorr" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val text-slate-600">{r.envCorr >= 0 ? '+' : ''}{Formatters.decimal(r.envCorr*60, 1)}'</span></div>
                            {isMoon && <div className="form-row"><span className="form-label text-slate-500">  └ Parallax <HelpIcon helpKey="parallax" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val text-slate-500">+{Formatters.decimal(r.corrPar*60, 1)}'</span></div>}
                            <div className="form-row border-t-2 border-slate-700 mt-2 pt-1"><span className="form-label font-bold text-base">Observed Alt (Ho) <HelpIcon helpKey="ho" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val text-lg">{Formatters.angle(r.ho)}</span></div>
                        </div>

                        {/* Col 2: Hour Angle */}
                        <div>
                            <div className="font-bold text-slate-800 border-b-2 border-slate-300 mb-2 pb-1 uppercase">Hour Angle (Time)</div>
                            <div className="form-row"><span className="form-label">GHA (Whole Hr) <HelpIcon helpKey="gha" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val">{r.ghaWhole != null ? Formatters.angle(r.ghaWhole) : Formatters.angle(r.ghaAries)}</span></div>
                            <div className="form-row"><span className="form-label">Incr ({r.minutes}m {r.seconds}s) <HelpIcon helpKey="incr" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val">+{Formatters.angle(r.ghaInc)}</span></div>
                            {isStar && <div className="form-row"><span className="form-label">SHA <HelpIcon helpKey="sha" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val">+{Formatters.angle(r.sha)}</span></div>}
                            {r.vCorr !== 0 && <div className="form-row"><span className="form-label">v correction <HelpIcon helpKey="vcorr" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val">{r.vCorr >= 0 ? '+' : ''}{Formatters.decimal(r.vCorr*60, 1)}'</span></div>}
                            <div className="form-row bg-slate-50"><span className="form-label font-bold">GHA Total</span><span className="form-val text-blue-800">{Formatters.angle(r.ghaFinal)}</span></div>
                            
                            <div className="form-row items-start pt-2">
                                <div className="flex flex-col justify-start">
                                    <span className="form-label">Assumed Lon <HelpIcon helpKey="ap" isVisible={isStudyMode} onShow={onShowHelp} /></span>
                                    {/* Prominent SET AP button */}
                                    <button 
                                        onClick={handleSetAP} 
                                        className="text-[10px] bg-amber-100 text-amber-900 border border-amber-300 px-2 py-1 rounded font-bold hover:bg-amber-200 mt-2 shadow-sm flex items-center gap-1" 
                                        title="Adjust AP Longitude for Integer LHA and Latitude for Integer Degrees"
                                    >
                                        <i data-lucide="crosshair" className="w-3 h-3"></i> SET AP FOR TABLE
                                    </button>
                                </div>
                                <span className="form-val mt-1">{Formatters.angle(r.apLonVal)}</span>
                            </div>
                            
                            <div className="form-row border-t-2 border-slate-700 mt-2 pt-1">
                                <span className="form-label font-bold text-base">LHA <HelpIcon helpKey="lha" isVisible={isStudyMode} onShow={onShowHelp} /></span>
                                <span className={`form-val text-lg ${isWholeLHA ? 'text-green-700' : 'text-slate-800'}`}>{Formatters.angle(r.lha)}</span>
                            </div>
                            {!isWholeLHA && <div className="text-[10px] text-amber-600 text-right italic">Non-integer LHA (No Table Page)</div>}
                        </div>

                        {/* Col 3: Result */}
                        <div className="bg-slate-50 p-2 rounded border border-slate-200 shadow-sm">
                            <div className="font-bold text-slate-800 border-b-2 border-slate-300 mb-2 pb-1 uppercase flex justify-between items-center">
                                <span>Declination & Intercept</span>
                                <div className="group relative">
                                    <button 
                                        onClick={() => canShowTable && onShowHO229(r.latVal, r.lha, r.decFinal)}
                                        disabled={!canShowTable}
                                        className={`text-xs px-2 py-1 rounded flex items-center gap-1 shadow transition-colors
                                            ${canShowTable 
                                                ? 'bg-blue-600 hover:bg-blue-500 text-white cursor-pointer' 
                                                : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}
                                    >
                                        <i data-lucide="book-open" className="w-3 h-3"></i> TABLE
                                    </button>
                                    {!canShowTable && (
                                        <div className="absolute bottom-full right-0 mb-2 w-48 bg-slate-800 text-white text-[10px] p-2 rounded shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50">
                                            Table requires Integer LHA and Integer Latitude. Use "SET AP FOR TABLE".
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="form-row"><span className="form-label">Dec (Whole Hr) <HelpIcon helpKey="dec" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val">{Formatters.dec(r.decWhole)}</span></div>
                            <div className="form-row"><span className="form-label">d correction <HelpIcon helpKey="dcorr" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val">{r.dCorr >= 0 ? '+' : ''}{Formatters.decimal(r.dCorr*60, 1)}'</span></div>
                            <div className="form-row bg-slate-50 mb-4"><span className="form-label font-bold">True Dec</span><span className="form-val text-blue-800">{Formatters.dec(r.decFinal)}</span></div>
                            
                            <div className="form-row">
                                <span className="form-label">Assumed Lat</span>
                                <span className={`form-val ${isWholeLat ? 'text-green-700' : ''}`}>{Formatters.lat(r.latVal)}</span>
                            </div>
                            <div className="form-row"><span className="form-label">Computed (Hc) <HelpIcon helpKey="hc" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val">{Formatters.angle(r.hc)}</span></div>
                            <div className="form-row border-t-2 border-slate-700 mt-2 pt-1 bg-green-50 px-1 rounded"><span className="form-label font-bold text-base text-green-900">Intercept (a) <HelpIcon helpKey="intercept" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val text-lg text-green-900">{Formatters.decimal(Math.abs(r.intercept), 1)} {r.intercept >= 0 ? 'T' : 'A'}</span></div>
                            <div className="form-row px-1"><span className="form-label font-bold">Azimuth (Zn) <HelpIcon helpKey="zn" isVisible={isStudyMode} onShow={onShowHelp} /></span><span className="form-val text-orange-600">{Formatters.decimal(r.zn, 1)}&deg;</span></div>
                            <div className="mt-4">
                                <button onClick={() => onSave(r.zn, r.intercept)} disabled={!obsData.body} className="w-full py-4 md:py-3 bg-green-600 hover:bg-green-500 text-white font-bold rounded flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed active:scale-95 transition-transform"><i data-lucide="plus-circle" className="w-5 h-5"></i> ADD TO PLOT</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const LopTable = ({ lops, selectedLops, toggleLopSelection, onDelete, onPlot }) => (
            <div className="card bg-white rounded-lg shadow border border-slate-200 overflow-hidden mb-12">
                <div className="bg-slate-50 p-3 border-b border-slate-200 font-bold text-slate-700 flex justify-between items-center">
                    <span>3. Saved LOPs</span>
                    <div className="flex gap-2">
                        <button onClick={onDelete} className="text-xs bg-red-100 text-red-700 border border-red-200 px-3 py-2 rounded hover:bg-red-200 flex items-center gap-1"><i data-lucide="trash" className="w-3 h-3"></i> Delete</button>
                        <button onClick={onPlot} className="text-xs bg-blue-600 text-white border border-blue-700 px-4 py-2 rounded hover:bg-blue-500 flex items-center gap-1 shadow-sm"><i data-lucide="map" className="w-3 h-3"></i> PLOT SELECTED</button>
                    </div>
                </div>
                <div className="overflow-x-auto">
                    <table className="w-full text-sm text-left">
                        <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b">
                            <tr>
                                <th className="px-4 py-3 w-10 text-center"><i data-lucide="check-square" className="w-4 h-4 mx-auto"></i></th>
                                <th className="px-4 py-3">Date / UTC</th>
                                <th className="px-4 py-3">Body</th>
                                <th className="px-4 py-3">C/S</th>
                                <th className="px-4 py-3">Zn</th>
                                <th className="px-4 py-3 text-right">Intercept</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                            {lops.length === 0 ? (
                                <tr><td colSpan={6} className="p-8 text-center text-slate-400">No sights saved yet.</td></tr>
                            ) : lops.map(lop => (
                                <tr key={lop.id} className="hover:bg-slate-50">
                                    <td className="px-4 py-3 text-center"><input type="checkbox" className="w-5 h-5" checked={selectedLops.has(lop.id)} onChange={() => toggleLopSelection(lop.id)} /></td>
                                    <td className="px-4 py-3 font-mono text-slate-600">
                                        <div className="text-[10px] font-bold text-slate-400 uppercase">{new Date(lop.time).toISOString().split('T')[0]}</div>
                                        <div>{new Date(lop.time).toISOString().split('T')[1].substring(0, 8)}</div>
                                    </td>
                                    <td className="px-4 py-3 font-bold">{lop.body}</td>
                                    <td className="px-4 py-3 font-mono text-xs">{lop.course}&deg; / {lop.speed}kt</td>
                                    <td className="px-4 py-3 font-mono text-blue-600 font-bold">{lop.zn}&deg;</td>
                                    <td className="px-4 py-3 font-mono text-right font-bold">{lop.intercept} <span className="text-xs text-slate-400">{lop.interceptDir}</span></td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>
        );

        // ==========================================
        // MODULE 5: MAIN CONTROLLER (SIGHT FORM)
        // ==========================================
        const SightForm = () => {
            const [showAlmanac, setShowAlmanac] = useState(false);
            const [showPlotter, setShowPlotter] = useState(false);
            const [showIdentify, setShowIdentify] = useState(false);
            const [showHO229, setShowHO229] = useState(false);
            const [ho229Params, setHo229Params] = useState(null);
            
            const [isRedMode, setIsRedMode] = useState(false);
            const [isStudyMode, setIsStudyMode] = useState(false);
            
            // Added pressure, temperature, unitSystem to initial state
            const [obsData, setObsData] = useState({ 
                body: '', dateTime: '', 
                hsDeg: '', hsMin: '', 
                ie: 0, he: 0, 
                apLatDeg: '', apLatMin: '', apLatDir: 'N', 
                apLonDeg: '', apLonMin: '', apLonDir: 'W', 
                course: '', speed: '',
                pressure: '1013', temperature: '15', unitSystem: 'metric',
                limb: 'L' // Default Lower Limb
            });
            const [almData, setAlmData] = useState({ ghaWhole: null, decWhole: null, v: 0, d: 0, sd: 0, hp: 0, sha: null, ghaAries: null });
            const [lops, setLops] = useState([]);
            const [selectedLops, setSelectedLops] = useState(new Set());
            const [modalConfig, setModalConfig] = useState(null);
            const [helpKey, setHelpKey] = useState(null);

            useEffect(() => {
                try {
                    const savedObs = localStorage.getItem('obsData');
                    if (savedObs) {
                         const parsed = JSON.parse(savedObs);
                         setObsData(prev => ({ 
                             ...prev, 
                             ...parsed, 
                             pressure: parsed.pressure || '1013', 
                             temperature: parsed.temperature || '15',
                             unitSystem: parsed.unitSystem || 'metric',
                             apLatDir: parsed.apLatDir || 'N', 
                             apLonDir: parsed.apLonDir || 'W',
                             limb: parsed.limb || 'L'
                         }));
                    }
                    const savedLops = localStorage.getItem('lops');
                    if (savedLops) setLops(JSON.parse(savedLops));
                } catch(e) {}
            }, []);
            useEffect(() => { localStorage.setItem('obsData', JSON.stringify(obsData)); }, [obsData]);
            useEffect(() => { localStorage.setItem('lops', JSON.stringify(lops)); }, [lops]);

            const handleSaveLop = (zn, intercept) => {
                if (!obsData.body || isNaN(intercept)) return;
                const newLop = {
                    id: Date.now(),
                    body: obsData.body,
                    time: obsData.dateTime,
                    apLatDeg: obsData.apLatDeg, apLatMin: obsData.apLatMin,
                    apLonDeg: obsData.apLonDeg, apLonMin: obsData.apLonMin,
                    course: obsData.course, speed: obsData.speed,
                    zn: parseFloat(zn).toFixed(1),
                    intercept: parseFloat(intercept).toFixed(1),
                    interceptDir: intercept >= 0 ? 'T' : 'A'
                };
                setLops([...lops, newLop]);
            };

            const handleReset = () => { 
                setModalConfig({
                    type: 'confirm',
                    message: 'Are you sure you want to clear all data? This cannot be undone.',
                    onConfirm: () => { localStorage.clear(); window.location.reload(); }
                });
            };

            const handleDeleteLops = () => { setLops(lops.filter(lop => !selectedLops.has(lop.id))); setSelectedLops(new Set()); };
            
            const handlePlot = () => { 
                if (selectedLops.size > 0) setShowPlotter(true); 
                else setModalConfig({ type: 'alert', message: 'Select at least one LOP to plot.', onConfirm: () => setModalConfig(null) });
            };

            const handleIdentify = () => {
                 if (!obsData.dateTime || !obsData.hsDeg) {
                    setModalConfig({ type: 'alert', message: 'Please enter at least Time and Sextant Altitude (Hs) to identify a body.', onConfirm: () => setModalConfig(null) });
                    return;
                 }
                 setShowIdentify(true);
            };

            const handleSelectIdentify = (candidate) => {
                setObsData(prev => ({ ...prev, body: candidate.name, limb: 'L' }));
                const d = new Date(obsData.dateTime);
                const type = candidate.type === 'Planet' ? candidate.name : 'Star';
                const name = candidate.type === 'Planet' ? null : candidate.name;
                const alm = NavMath.calculateAlmanac(d, type, name);
                if(alm) {
                    const isStar = candidate.type === 'Star';
                    setAlmData({
                        ...alm,
                        ghaWhole: isStar ? alm.ghaAries : alm.gha, 
                        decWhole: alm.dec
                    });
                }
                setShowIdentify(false);
            };
            
            const handleShowHO229 = (lat, lha, dec) => {
                setHo229Params({ lat, lha, dec });
                setShowHO229(true);
            };

            const toggleLopSelection = (id) => { const next = new Set(selectedLops); if (next.has(id)) next.delete(id); else next.add(id); setSelectedLops(next); };

            return (
                <div className={`min-h-screen pb-12 ${isRedMode ? 'red-mode' : ''}`}>
                    {showAlmanac && <AlmanacModal onClose={() => setShowAlmanac(false)} onSelectData={(d) => { setObsData(p => ({...p, body: d.body, limb: d.limb, dateTime: d.time.toISOString()})); setAlmData(d); }} />}
                    {showPlotter && <PlotterModal lops={lops.filter(l => selectedLops.has(l.id))} onClose={() => setShowPlotter(false)} />}
                    {showIdentify && <IdentifyModal obsData={obsData} onClose={() => setShowIdentify(false)} onSelect={handleSelectIdentify} />}
                    {showHO229 && ho229Params && <HO229Modal lat={ho229Params.lat} lha={ho229Params.lha} dec={ho229Params.dec} onClose={() => setShowHO229(false)} />}
                    {modalConfig && <NotificationModal message={modalConfig.message} type={modalConfig.type} onConfirm={() => { modalConfig.onConfirm(); setModalConfig(null); }} onCancel={() => setModalConfig(null)} />}
                    {helpKey && <StudyModal helpKey={helpKey} onClose={() => setHelpKey(null)} />}

                    <Header onReset={handleReset} isRedMode={isRedMode} setIsRedMode={setIsRedMode} isStudyMode={isStudyMode} setIsStudyMode={setIsStudyMode} />

                    <main className="max-w-6xl mx-auto p-4 space-y-6">
                        <ObservationCard 
                            obsData={obsData} 
                            setObsData={setObsData} 
                            onOpenAlmanac={() => setShowAlmanac(true)} 
                            onIdentify={handleIdentify}
                            isStudyMode={isStudyMode}
                            onShowHelp={setHelpKey}
                        />
                        <WorksheetCard 
                            obsData={obsData} 
                            setObsData={setObsData}
                            almData={almData} 
                            onSave={handleSaveLop} 
                            isStudyMode={isStudyMode}
                            onShowHelp={setHelpKey}
                            onShowHO229={handleShowHO229}
                            setModalConfig={setModalConfig}
                        />
                        <LopTable lops={lops} selectedLops={selectedLops} toggleLopSelection={toggleLopSelection} onDelete={handleDeleteLops} onPlot={handlePlot} />
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SightForm />);
        
        setInterval(() => { if (window.lucide) window.lucide.createIcons(); }, 1000);
    </script>
</body>
</html>
