    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // J2000 Epoch (Jan 1, 2000, 00:00 UTC) for elapsed hours calculation
        const J2000_UTC_EPOCH = new Date(Date.UTC(2000, 0, 1, 0, 0, 0)).getTime();
        
        // --- PHYSICS ENGINE (Global Scope for Components) ---

        const CONSTITUENTS = {

            // Added constituents from CSV data structure for parsing lookup

            "TAU1": { speed: 13.992052 }, "MPS2": { speed: 29.025173 }, "MSK6": { speed: 89.041069 }, "MSM": { speed: 1.015896 },
            "MSN2": { speed: 28.943036 }, "MSN6": { speed: 87.968208 }, "NLK2": { speed: 29.439730 }, "NO1": { speed: 14.492052 },
            "OP2": { speed: 28.439730 }, "OQ2": { speed: 27.398661 }, "PHI1": { speed: 14.041069 }, "KP1": { speed: 15.041069 },
            "PI1": { speed: 14.958931 }, "TK1": { speed: 14.958931 }, "PSI1": { speed: 13.958931 }, "RP1": { speed: 15.041069 },
            "S3": { speed: 45.000000 }, "SIG1": { speed: 13.943036 }, "SK3": { speed: 45.041069 }
        };

        // Normalize angle 0-360
        const norm = (val) => {
            let v = val % 360.0;
            if (v < 0) v += 360.0;
            return v;
        };

        // Calculates Astronomical Elements (s, h, p, N, p1) for a specific Julian Date
        const getAstroElements = (JD) => {
            const T = (JD - 2451545.0) / 36525.0; // Julian Centuries since J2000
            
            // Mean Longitude of Moon (s)
            const s = norm(218.3164477 + 481267.88123421 * T - 0.0015786 * T*T + T*T*T/538841.0);
            // Mean Longitude of Sun (h)
            const h = norm(280.46645 + 36000.76983 * T + 0.0003032 * T*T);
            // Longitude of Lunar Perigee (p)
            const p = norm(83.353243 + 4069.01363525 * T - 0.010321 * T*T - T*T*T/80000.0);
            // Longitude of Moon's Node (N)
            const N = norm(125.044522 - 1934.13626199 * T + 0.0020708 * T*T + T*T*T/450000.0);
            // Longitude of Solar Perigee (p1)
            const p1 = norm(282.94 + 1.7192 * T);

            return { s, h, p, N, p1, JD };
        };

        // Computes V0 + u (Equilibrium Argument) and f (Node Factor) for all constituents
        // Uses Schureman's formulas for V0 to ensure correct phase relationships.
        const getEquilibrium = (year) => {
            const startOfYear = new Date(Date.UTC(year, 0, 1, 0, 0, 0));
            const JD = (startOfYear.getTime() / 86400000.0) + 2440587.5;
            const { s, h, p, N, p1 } = getAstroElements(JD);
            
            // Calculate hours from J2000 to Start of current Year for constituents without standard formulas
            const hoursFromJ2000 = (startOfYear.getTime() - J2000_UTC_EPOCH) / 3600000;

            const results = {};
            const rad = Math.PI / 180;

            const N_rad = N * rad;
            
            // Calculate Base Node Factors (M2, K1, O1)
            const fM2 = 1.0004 - 0.0373*Math.cos(N_rad) + 0.0002*Math.cos(2*N_rad);
            const uM2 = -2.14*Math.sin(N_rad);
            
            const fK1 = 1.0060 + 0.1150*Math.cos(N_rad) - 0.0088*Math.cos(2*N_rad);
            const uK1 = -8.86*Math.sin(N_rad) + 0.68*Math.sin(2*N_rad);
            
            const fO1 = 1.0089 + 0.1871*Math.cos(N_rad) - 0.0147*Math.cos(2*N_rad);
            const uO1 = 10.80*Math.sin(N_rad) - 1.34*Math.sin(2*N_rad);
            
            const fK2 = 1.0241 + 0.2863*Math.cos(N_rad) + 0.0083*Math.cos(2*N_rad);
            const uK2 = -17.74*Math.sin(N_rad) + 0.68*Math.sin(2*N_rad);

            // V0 Calculations (Schureman / NOAA Standard)
            // T=0 at start of year UTC.
            const V0_M2 = 2*h - 2*s; 
            const V0_S2 = 0;
            const V0_N2 = 2*h - 3*s + p;
            const V0_K1 = h + 90;
            const V0_O1 = h - 2*s - 90;
            const V0_P1 = -h - 90;
            const V0_Q1 = h - 3*s + p - 90;
            const V0_K2 = 2*h;

            const nodal = {
                "M2": { f: fM2, u: uM2, v0: V0_M2 },
                "S2": { f: 1.0, u: 0.0, v0: V0_S2 },
                "N2": { f: fM2, u: uM2, v0: V0_N2 }, 
                "K1": { f: fK1, u: uK1, v0: V0_K1 },
                "O1": { f: fO1, u: uO1, v0: V0_O1 },
                "P1": { f: 1.0, u: 0.0, v0: V0_P1 },
                "K2": { f: fK2, u: uK2, v0: V0_K2 },
                "Q1": { f: fO1, u: uO1, v0: V0_Q1 },
                
                // Shallow Water Derivatives (Crucial for Curve Shape & Amplitude)
                // M4 is 2*M2. V0 = 2*V0(M2), f = f(M2)^2, u = 2*u(M2)
                "M4":  { f: fM2 * fM2, u: 2 * uM2, v0: 2 * V0_M2 },
                "M6":  { f: fM2 * fM2 * fM2, u: 3 * uM2, v0: 3 * V0_M2 },
                "M8":  { f: fM2 * fM2 * fM2 * fM2, u: 4 * uM2, v0: 4 * V0_M2 },
                "MS4": { f: fM2, u: uM2, v0: V0_M2 + V0_S2 }, // M2 + S2
                "MN4": { f: fM2 * fM2, u: 2 * uM2, v0: V0_M2 + V0_N2 }, // M2 + N2
                "MK3": { f: fM2 * fK1, u: uM2 + uK1, v0: V0_M2 + V0_K1 },
                "S4":  { f: 1.0, u: 0.0, v0: 2 * V0_S2 },
                "S6":  { f: 1.0, u: 0.0, v0: 3 * V0_S2 },
                
                "default": { f: 1.0, u: 0.0, v0: null }
            };

            Object.keys(CONSTITUENTS).forEach(name => {
                const c = CONSTITUENTS[name];
                const node = nodal[name] || nodal["default"];
                
                // If V0 is explicitly defined above, use it. 
                // Otherwise, fallback to projecting speed from J2000 (less accurate but necessary for obscure components).
                const V0 = (node.v0 !== null && node.v0 !== undefined) ? node.v0 : (c.speed * hoursFromJ2000);

                results[name] = {
                    V0: norm(V0),
                    u: node.u,
                    f: node.f,
                    speed: c.speed
                };
            });
            return results;
        };

        // Calculates Sun Rise/Set times (Meeus method)
        function getSunTimes(date, lat, lng) {
            const startOfDay = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
            const jd0 = (startOfDay.getTime() / 86400000.0) + 2440587.5;
            
            const n = Math.round(jd0 - 2451545.0 + 0.0009 + (lng / 360.0)); 
            const J_star = 2451545.0 + 0.0009 - (lng / 360.0) + n;

            const M = (357.5291 + 0.98560028 * (J_star - 2451545.0)) % 360;
            const rad = Math.PI / 180;
            const C = 1.9148 * Math.sin(M * rad) + 0.0200 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
            const lambda = (M + C + 180 + 102.9372) % 360;
            const J_transit = J_star + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * lambda * rad);
            const delta = Math.asin(Math.sin(lambda * rad) * Math.sin(23.44 * rad));
            
            const cosOmega = (Math.sin((-0.83 * rad)) - Math.sin(lat * rad) * Math.sin(delta)) / (Math.cos(lat * rad) * Math.cos(delta));

            if (cosOmega < -1 || cosOmega > 1) return { rise: null, set: null };
            
            const omega = Math.acos(cosOmega);
            const J_rise = J_transit - (omega / (2 * Math.PI));
            const J_set = J_transit + (omega / (2 * Math.PI));

            return { 
                rise: new Date((J_rise - 2440587.5) * 86400000), 
                set: new Date((J_set - 2440587.5) * 86400000) 
            };
        }


        // --- HELPER FUNCTIONS ---
        const dateToJD = (date) => (date.getTime() / 86400000.0) + 2440587.5;
        
        // This normalization is critical for merging data from various sources
        const normalizeKey = (name) => {
            if (!name) return '';
            // Aggressively normalize: remove all non-alphanumeric/non-space chars, remove multiple spaces, and uppercase.
            return name.replace(/[^a-zA-Z0-9\s]/g, '').replace(/\s+/g, '').toUpperCase().trim();

        const formatStationTime = (timestamp, offsetHours) => {
            const d = new Date(timestamp);
            const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
            const stationTime = new Date(utc + (3600000 * offsetHours));
            return stationTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        };

        const formatStationDate = (timestamp, offsetHours) => {
            const d = new Date(timestamp);
            const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
            const stationTime = new Date(utc + (3600000 * offsetHours));
            return stationTime.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' });
        };
        
        const formatUTCOffset = (offsetHours) => {
            if (offsetHours === null) return 'N/A';
            const sign = offsetHours >= 0 ? '+' : '-';
            const absoluteHours = Math.floor(Math.abs(offsetHours));
            const absoluteMins = Math.round((Math.abs(offsetHours) - absoluteHours) * 60);
            
            const hoursStr = String(absoluteHours).padStart(2, '0');
            const minsStr = String(absoluteMins).padStart(2, '0');

            return `UTC ${sign}${hoursStr}:${minsStr}`;
        };

        const haversineDistance = (lat1, lon1, lat2, lon2) => {
            const R = 3958.8; // Radius of Earth in miles
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        };

        // --- LOCAL STORAGE CACHE ---
        const getCachedOffset = () => {
            const cached = localStorage.getItem('tideApp_utcOffset');
            return cached !== null ? parseFloat(cached) : 0;
        };

        const setCachedOffset = (offset) => {
            localStorage.setItem('tideApp_utcOffset', offset.toString());
        };


        // --- LUNAR & TIDES (Unchanged) ---

        // Lunar Phase calculation (Simplified Meeus/Conway formula)
        const getLunarPhase = (JD) => {
            const newMoonJd = 2451550.09766;
            const synodicMonth = 29.53058867; // Days

            const daysSinceNewMoon = JD - newMoonJd;
            let phaseDays = daysSinceNewMoon % synodicMonth;
            if (phaseDays < 0) phaseDays += synodicMonth; 
            
            const phaseAngle = (phaseDays / synodicMonth) * 360;

            const phase = {
                days: phaseDays,
                angle: phaseAngle,
                text: 'Unknown',
                emoji: '⚫',
                neapSpring: 'Transitioning'
            };

            if (phaseAngle < 22.5 || phaseAngle >= 337.5) {
                phase.text = 'New Moon';
                phase.emoji = '🌑';
            } else if (phaseAngle < 67.5) {
                phase.text = 'Waxing Crescent';
                phase.emoji = '🌒';
            } else if (phaseAngle < 112.5) {
                phase.text = 'First Quarter';
                phase.emoji = '🌓';
            } else if (phaseAngle < 157.5) {
                phase.text = 'Waxing Gibbous';
                phase.emoji = '🌔';
            } else if (phaseAngle < 202.5) {
                phase.text = 'Full Moon';
                phase.emoji = '🌕';
            } else if (phaseAngle < 247.5) {
                phase.text = 'Waning Gibbous';
                phase.emoji = '🌖';
            } else if (phaseAngle < 292.5) {
                phase.text = 'Last Quarter';
                phase.emoji = '🌗';
            } else { 
                phase.text = 'Waning Crescent';
                phase.emoji = '🌘';
            }

            const angleFromSpring = Math.min(Math.abs(phaseAngle), Math.abs(phaseAngle - 180));
            const angleFromNeap = Math.min(Math.abs(phaseAngle - 90), Math.abs(phaseAngle - 270));
            
            if (angleFromSpring < 20) { 
                phase.neapSpring = 'Spring Tide';
            } else if (angleFromNeap < 20) { 
                phase.neapSpring = 'Neap Tide';
            } else {
                phase.neapSpring = 'Transitioning';
            }

            return phase;
        };

        // --- PARSERS ---

        // This parser handles the complex CSV structure with inline constituents
        const parseHarmonicsCSV = (text) => {
            const lines = text.split(/\r?\n/);
            const stations = [];
            
            // Assuming the first line contains the header names
            const header = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
            
            const headerMap = {};
            header.forEach((colName, index) => {
                headerMap[colName] = index;
            });

            // Find the index where constituent data begins (e.g., C_J1_A)
            const CONSTITUENT_START_INDEX = header.findIndex(c => c.includes('C_J1_A'));
            
            const dataLines = lines.slice(1).filter(line => line.trim());

            for (const line of dataLines) {
                // Use a robust regex to split by comma, ignoring commas inside quoted fields
                const parts = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
                
                if (parts.length < header.length) continue; 

                // --- 1. Extract Metadata and Offsets ---
                const type = parts[headerMap['Type']].replace(/"/g, '').trim() === 'T' ? 'reference' : 'subordinate';
                const name = parts[headerMap['Name']].replace(/"/g, '').trim();
                const lat = parseFloat(parts[headerMap['Latitude']]);
                const lon = parseFloat(parts[headerMap['Longitude']]);
                
                // Datum/Offset fields (using defensive lookup as columns might be N/A)
                const datumRaw = parts[headerMap['Datum_Offset']] || '0';
                const datum = parseFloat(datumRaw.replace(/"/g, '').trim()) || 0;

                const zoneOffsetStr = parts[headerMap['Zone_Offset_(HHMM)']] ? parts[headerMap['Zone_Offset_(HHMM)']].replace(/"/g, '').trim() : '0';
                let offsetHours = 0;
                if (zoneOffsetStr !== 'N/A') {
                    // Logic to parse HHMM (e.g., -0500)
                    if (zoneOffsetStr.match(/^([+-]?\d{1,2})(\d{2})$/)) {
                        // FIX: Added closing '/' to the regex in .match()
                        const match = zoneOffsetStr.match(/^([+-]?\d{1,2})(\d{2})$/);
                        const hours = parseInt(match[1]);
                        const mins = parseInt(match[2]);
                        offsetHours = hours + (mins / 60) * (hours < 0 ? -1 : 1);
                    } 
                    // Handle +/-H or +/-H:MM (if the format is slightly different)
                    else if (zoneOffsetStr.match(/^[+-]?\d{1,2}(:\d{2})?$/)) {
                        const [hoursStr, minsStr] = zoneOffsetStr.split(':');
                        const hours = parseInt(hoursStr);
                        const mins = parseInt(minsStr || '0');
                        offsetHours = hours + (mins / 60) * (hours < 0 ? -1 : 1);
                    }
                }

                const refName = parts[headerMap['Ref_Station_Name']] ? parts[headerMap['Ref_Station_Name']].replace(/"/g, '').trim() : name;
                const hasOffsets = parts[headerMap['Min_Time_Add_(HHMM)']] !== 'N/A' && parts[headerMap['Min_Time_Add_(HHMM)']] !== '-1';


                // --- 2. Extract Harmonic Constants ---
                const constituents = [];
                if (CONSTITUENT_START_INDEX !== -1) {
                    for (let i = CONSTITUENT_START_INDEX; i < parts.length; i += 2) {
                        const colA = header[i]; 
                        const colE = header[i + 1]; 

                        if (colE && parts[i] && parts[i + 1]) {
                            const constituentName = colA.substring(2, colA.length - 2).trim(); 
                            const amplitude = parseFloat(parts[i]);
                            const epoch = parseFloat(parts[i + 1]);

                            if (CONSTITUENTS[constituentName] && !isNaN(amplitude) && !isNaN(epoch) && amplitude > 0.001) {
                                constituents.push({
                                    name: constituentName,
                                    amp: amplitude,
                                    phase: epoch 
                                });
                            }
                        }
                    }
                }
                
                // --- 3. Build Station Object ---
                if (!isNaN(lat) && !isNaN(lon) && name) {
                    const station = {
                        type: type,
                        name: name,
                        coordinates: { lat, lon },
                        refName: refName, 
                        offset: offsetHours,
                        datum: datum, 
                        units: 'meters', 
                        constituents: constituents,
                    };

                    if (hasOffsets) {
                        const minTimeAdd = parts[headerMap['Min_Time_Add_(HHMM)']] ? parseFloat(parts[headerMap['Min_Time_Add_(HHMM)']]) : 0;
                        const minLevelMult = parts[headerMap['Min_Level_Mult']] ? parseFloat(parts[headerMap['Min_Level_Mult']]) : 1.0;
                        const maxTimeAdd = parts[headerMap['Max_Time_Add_(HHMM)']] ? parseFloat(parts[headerMap['Max_Time_Add_(HHMM)']]) : 0;
                        const maxLevelMult = parts[headerMap['Max_Level_Mult']] ? parseFloat(parts[headerMap['Max_Level_Mult']]) : 1.0;

                        station.offsets = {
                            highTime: isNaN(minTimeAdd) ? 0 : minTimeAdd,
                            highMult: isNaN(minLevelMult) ? 1.0 : minLevelMult,
                            highAdd: datum,
                            lowTime: isNaN(maxTimeAdd) ? 0 : maxTimeAdd,
                            lowMult: isNaN(maxLevelMult) ? 1.0 : maxLevelMult,
                            lowAdd: datum,
                        };
                    }
                    
                    stations.push(station);
                }
            }
            return stations;
        };


        // Placeholder/Legacy parser - functionality retained for old loading logic.
        const parseHarmMsc = (text) => {
            const lines = text.split(/\r?\n/);
            const stations = [];
            let currentStation = null;
            let tempLat = null;
            let tempLon = null;
            let expectingDatum = false;

            const offsetRegex = /^&([0-9.-]+)\s+([0-9.-]+)\s+([0-9.-]+)\s+([0-9.-]+)\s+([0-9.-]+)\s+([0-9.-]+)\s+\d+\s+\d+\s+(.*)/;

                        const sign = parseInt(headerMatch[3]) < 0 || (parseInt(headerMatch[3]) === 0 && headerMatch[3].startsWith('-')) ? -1 : 1;
                        const offsetHours = parseInt(headerMatch[3]) + (parseInt(headerMatch[4])/60) * sign;

            // FIX: Data is already parsed as an object by fetchFile when loaded remotely/locally.

            const stations = [];

            if (!Array.isArray(rawData)) {

                     const totalMinutes = parseInt(item.zone_offset_hhmm, 10);
                     const sign = totalMinutes >= 0 ? 1 : -1;
                     const absMinutes = Math.abs(totalMinutes);

        // --- GRAPH COMPONENT (Updated for Touch and Mobile Layout) ---
        const TideGraph = ({ station, allStations, onClose, customOffset, setCustomOffset }) => {
            const containerRef = useRef(null);

            const displayOffset = customOffset;

            const [cursor, setCursor] = useState({

            const touchState = useRef({

                lastDistance: 0,

            });

            let refStation = station;
            
            const normalizedRefName = normalizeKey(station.refName || station.name);
            
            if (station.type === 'subordinate') {
                refStation = allStations.find(item => normalizeKey(item.name) === normalizedRefName && item.type === 'reference');
                
                if (!refStation && station.offsets) {
                     refStation = {
                        name: station.name,
                        datum: station.datum,
                        units: station.units || 'meters',
                        constituents: [],

                    };
                }
            }
            
            if (station.type === 'reference') {
                refStation = station; 
            }


            if (!refStation || refStation.datum === undefined || refStation.datum === null) return (
                <div className="fixed inset-0 z-[3000] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
                    <div className="bg-white p-8 rounded-lg text-center shadow-xl">
                        <p className="text-xl font-bold text-red-600 mb-2">Prediction Data Missing</p>
                        <p className="text-slate-600">The primary datum or reference data for "{station.refName || station.name}" was not found.</p>
                        <button onClick={onClose} className="mt-4 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition-colors text-sm font-semibold">
                            Back to Map
                        </button>
                    </div>
                </div>
            );
            
            const L_ref = (refStation.coordinates && refStation.coordinates.lon) ? refStation.coordinates.lon : 0; // Get Longitude of the reference station once
            // --- END CRITICAL ---


            const { dataPoints, nightZones } = useMemo(() => {
                const now = new Date();
                const windowStart = new Date(now.getTime() - (12 * 3600000) + (panOffset * 3600000));
                const windowEnd = new Date(windowStart.getTime() + (zoomLevel * 3600000));
                
                // AUDIT FIX 1: CORRECT TIME BASIS FOR EQUILIBRIUM ARGUMENTS
                // The `getEquilibrium` function returns V0+u for the START OF THE YEAR (Jan 1, 00:00 UTC).
                // Therefore, the time multiplier (speed * t) must use time elapsed SINCE THE START OF THE YEAR,
                // not since J2000. Using J2000 time adds ~25 years of phase motion to a V0 that already includes it.
                const currentYear = windowStart.getUTCFullYear();
                const equil = getEquilibrium(currentYear);
                const startOfYearTime = new Date(Date.UTC(currentYear, 0, 1, 0, 0, 0)).getTime(); 
                
                const points = [];
                const step = 0.25; // 15 mins
                const totalHours = (windowEnd - windowStart) / 3600000;
                
                for(let h=0; h <= totalHours; h+=step) {
                    const t_utc = windowStart.getTime() + (h * 3600000);
                    
                    // AUDIT FIX 2: TIME ELAPSED SINCE YEAR START (matching the V0 epoch)
                    const hoursSinceYearStart = (t_utc - startOfYearTime) / 3600000;

                    let height = refStation.datum || 0;

                    if (refStation.constituents && refStation.constituents.length > 0) {
                        refStation.constituents.forEach(c => {
                            const eq = equil[c.name];
                            if (!eq) return;
                            
                            // AUDIT FIX 3: STANDARD HARMONIC FORMULA
                            // Arg = (V0+u) + (speed * t) + (speed * L/15) - g
                            // 1. (V0+u): Equilibrium at start of year.
                            // 2. (speed * t): Advance time forward from start of year.
                            // 3. (speed * L/15): Longitude correction to convert Greenwich Eq. Arg to Local Eq. Arg.
                            //    (Positive for East longitude, Negative for West like Ushuaia).
                            // 4. - g: Subtract local phase lag.
                            const longitudeCorrection = eq.speed * (L_ref / 15.0);

                            const argDeg = (eq.V0 + eq.u) + (eq.speed * hoursSinceYearStart) + longitudeCorrection - c.phase;
                            const argRad = argDeg * (Math.PI / 180);
                            
                            height += (c.amp * eq.f) * Math.cos(argRad);
                        });
                    }

                    if (station.type === 'subordinate' && station.offsets) {
                        const { highMult, lowMult, highAdd, lowAdd, highTime, lowTime } = station.offsets;
                        const avgMult = (highMult + lowMult) / 2;
                        const avgAdd = (highAdd + lowAdd) / 2;
                        const shiftHours = (highTime + lowTime) / 2 / 60; // Subordinate time shift in hours
                        
                        if (refStation.constituents.length === 0) {
                             height = (refStation.datum * avgMult) + avgAdd;
                        } else {
                            let hRef = refStation.datum || 0;
                            
                            refStation.constituents.forEach(c => {
                                const base = equil[c.name];
                                if (!base) return;
                                
                                // AUDIT FIX 3 (Subordinate): Apply same standard formula
                                const longitudeCorrection = base.speed * (L_ref / 15.0); 
                                
                                // Subordinate time shift applies to time variable
                                const t_shifted_hours = hoursSinceYearStart - shiftHours;
                                
                                // Argument: (V0+u) + w*t_shifted + w*L/15 - g
                                const argDeg = (base.V0 + base.u) + (base.speed * t_shifted_hours) + longitudeCorrection - c.phase;
                                
                                hRef += (c.amp * base.f) * Math.cos(argDeg * (Math.PI/180));
                            });
                            
                            height = (hRef * avgMult) + avgAdd;
                        }
                    }
                    
                    points.push({ time: t_utc, height });

                const zones = [];
                const coords = station.coordinates || refStation.coordinates;
                if (coords) {
                    const startDay = new Date(windowStart);
                    startDay.setUTCHours(0,0,0,0);
                    startDay.setDate(startDay.getDate() - 1); 
                    const endDay = new Date(windowEnd);
                    endDay.setUTCHours(23,59,59,999);
                    
                    const loop = new Date(startDay);
                    while(loop.getTime() <= endDay.getTime() + 86400000) {
                        const sun = getSunTimes(loop, coords.lat, coords.lon);
                        
                        if (sun.set && sun.rise) {
                            const nightStart = sun.set.getTime();
                            
                            const nextDay = new Date(loop);
                            nextDay.setDate(nextDay.getDate() + 1);
                            const nextSun = getSunTimes(nextDay, coords.lat, coords.lon);
                            const nightEnd = nextSun.rise.getTime();
                            
                            if (nightEnd > windowStart.getTime() && nightStart < windowEnd.getTime()) {
                                zones.push({ start: nightStart, end: nightEnd });
                            }
                        }
                        loop.setDate(loop.getDate() + 1);
                    }
                }

                return { dataPoints: points, nightZones: zones };
            }, [station, allStations, zoomLevel, panOffset]);

            // Set initial cursor time to the start of the visible graph
            useEffect(() => {

                        height: dataPoints[0].height,

            const maxH = validHeights.length > 0 ? Math.max(...validHeights) : 1;

            const range = maxH - minH || 1;
            const pad = range * 0.4; 
            
            const width = containerRef.current ? containerRef.current.clientWidth : 800;
            const height = containerRef.current ? containerRef.current.clientHeight : 400;

            const startTime = dataPoints.length > 0 ? dataPoints[0].time : 0;
            const duration = dataPoints.length > 0 ? dataPoints[dataPoints.length-1].time - startTime : 1;

            const Y_TOP_MARGIN = 30; 
            const Y_BOTTOM_MARGIN = 45; 
            const Y_PLOT_HEIGHT = height - Y_TOP_MARGIN - Y_BOTTOM_MARGIN;

            const mapX = (t) => (width && duration) ? ((t - startTime) / duration) * width : 0;
            
            const mapY = (h) => {
                if (Y_PLOT_HEIGHT <= 0 || range + pad * 2 <= 0) return Y_TOP_MARGIN;

                const dataRange = range + pad * 2;
                const normalizedY = (h - (minH - pad)) / dataRange;
                const plotY = Y_TOP_MARGIN + (1 - normalizedY) * Y_PLOT_HEIGHT;
                
                return isFinite(plotY) ? plotY : Y_TOP_MARGIN;
            };


            const handleMouseMove = (e) => {
                if (!containerRef.current || dataPoints.length === 0) return;
                const rect = containerRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percentX = x / rect.width;
                const timeSpan = dataPoints[dataPoints.length-1].time - dataPoints[0].time;
                const timeAtCursor = dataPoints[0].time + (percentX * timeSpan);
                
                const targetTime = timeAtCursor;
                let bestIdx = 0;
                let minDiff = Infinity;

                for (let i = 0; i < dataPoints.length; i++) {
                    const diff = Math.abs(dataPoints[i].time - targetTime);
                    if (diff < minDiff) {
                        minDiff = diff;
                        bestIdx = i;
                    }
                }

                const pt = dataPoints[bestIdx];
                setCursor({ active: true, time: pt.time, height: pt.height, x: mapX(pt.time), y: mapY(pt.height) });
            };
            
            // --- TOUCH HANDLERS FOR MOBILE ZOOM/PAN ---
            const handleTouchStart = (e) => {

                        ...touchState.current,
                        start: { x: touches[0].clientX, y: touches[0].clientY },
                        initialPan: panOffset,
                        isPanning: true,
                        isZooming: false

                } else if (touches.length >= 2) {

                    const d = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);

                        initialZoom: zoomLevel,

                const touches = e.touches;
                const current = touchState.current;
                
                // Track finger position for desktop-like mouse hover/crosshair

                    const x = touches[0].clientX - rect.left;
                    const percentX = x / rect.width;
                    const timeSpan = dataPoints[dataPoints.length-1].time - dataPoints[0].time;
                    const timeAtCursor = dataPoints[0].time + (percentX * timeSpan);

                    let bestIdx = 0;
                    let minDiff = Infinity;
                    for (let i = 0; i < dataPoints.length; i++) {
                        const diff = Math.abs(dataPoints[i].time - timeAtCursor);
                        if (diff < minDiff) {
                            minDiff = diff;
                            bestIdx = i;
                        }
                    }
                    const pt = dataPoints[bestIdx];
                    setCursor({ active: true, time: pt.time, height: pt.height, x: mapX(pt.time), y: mapY(pt.height) });
                }


                if (current.isZooming && touches.length >= 2) {
                    // Pinch Zoom Logic
                    const newDistance = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
                    
                    const scale = newDistance / current.lastDistance;
                    let newZoom = current.initialZoom * (1 / scale);
                    
                    // Limit zoom range
                    newZoom = Math.max(6, Math.min(168, newZoom));
                    
                    setZoomLevel(newZoom);
                    // Update initial distance for smooth movement
                    touchState.current.lastDistance = newDistance; 
                } else if (current.isPanning && touches.length === 1) {
                    // Single-finger Pan Logic
                    const startX = current.start.x;
                    const currentX = touches[0].clientX;
                    
                    const dx = currentX - startX;
                    
                    // Convert pixel change to hour change. Using a constant factor (e.g., 50px = 1 hour shift)
                    // The ratio of `dx` to `width` represents the portion of the current zoom window we've dragged.
                    const hourChange = (dx / width) * zoomLevel;
                    
                    // Update pan offset (inverted: dragging right shifts window left, meaning less negative panOffset)
                    setPanOffset(current.initialPan - hourChange);
                }
            };

            const handleTouchEnd = () => {
                // Reset touch state variables after a drag/pinch ends
                touchState.current = {
                    ...touchState.current,
                    start: null,
                    isPanning: false,
                    isZooming: false,
                    lastDistance: 0
                };
            };
            // --- END TOUCH HANDLERS ---

            const pathD = useMemo(() => {
                if(dataPoints.length === 0) return "";
                return "M " + dataPoints.map(p => `${mapX(p.time).toFixed(1)},${mapY(p.height).toFixed(1)}`).join(" L ");
            }, [dataPoints, minH, maxH, width, height]);

            const cursorTime = cursor.active && cursor.time ? formatStationTime(cursor.time, displayOffset) : "--:--";
            const cursorDate = cursor.active && cursor.time ? formatStationDate(cursor.time, displayOffset) : "---";
            const cursorHeight = cursor.active ? cursor.height.toFixed(2) : "--.--";

            return (
                <div className="fixed inset-0 z-[3000] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-0 sm:p-4">
                    <div className="bg-white border-0 sm:border border-slate-200 w-full h-full sm:max-w-6xl sm:h-[85vh] sm:rounded-lg shadow-2xl flex flex-col overflow-hidden">
                        
                        {/* Header Panel: Stack vertically on mobile, keep horizontal on desktop */}
                        <div className="bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row items-center justify-between p-3 sm:px-6 shrink-0 h-auto sm:h-20">
                            
                            {/* Title and Coords (Top Left/Center Mobile) */}
                            <div className="flex items-center gap-3 sm:gap-6 w-full sm:w-auto border-b sm:border-b-0 pb-2 sm:pb-0 mb-2 sm:mb-0">
                                <img src="https://xaxero.com/images/XaxeroLogoSansSloganCopy.png" className="h-6 sm:h-8" alt="Xaxero" />
                                <div className="truncate">
                                    <h2 className="text-sm sm:text-lg font-bold text-slate-800 leading-tight truncate">{station.name}</h2>
                                    <div className="text-[10px] sm:text-xs text-slate-500 flex gap-3">
                                        <span>{station.coordinates ? `${station.coordinates.lat.toFixed(4)}°N ${station.coordinates.lon.toFixed(4)}°E` : 'No Coords'}</span>
                                        <span className="hidden sm:inline">Datum: {refStation.datum ? refStation.datum.toFixed(2) : '0.00'} {refStation.units}</span>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Cursor Readout (Center Mobile/Desktop) */}
                            <div className="flex items-center justify-center gap-4 sm:gap-8 bg-white px-3 sm:px-6 py-2 rounded-full border border-slate-200 shadow-sm">
                                <div className="text-right hidden sm:block">
                                    <div className="text-[10px] text-slate-400 uppercase font-bold">Date</div>
                                    <div className="text-sm font-mono text-slate-600">{cursorDate}</div>
                                </div>
                                <div className="text-center">
                                    {/* Conditional display for the time label */}
                                    <div className="text-[10px] text-slate-400 uppercase font-bold">
                                        <span className="hidden sm:inline">UTC + Offset</span>
                                        <span className="sm:hidden">Time (UT)</span>
                                    </div>
                                    <div className="text-base sm:text-lg font-mono font-bold text-slate-800">{cursorTime}</div>
                                </div>
                                <div className="text-center">
                                    <div className="text-[10px] text-slate-400 uppercase font-bold">Height</div>
                                    <div className="text-xl sm:text-2xl font-mono font-bold text-red-600">{cursorHeight} <span className="text-xs text-slate-400 font-sans font-normal">{refStation.units}</span></div>
                                </div>
                            </div>

                            {/* Controls (Bottom Right/Desktop Right) */}
                            <div className="flex items-center justify-end w-full sm:w-auto gap-2 sm:gap-4 mt-2 sm:mt-0">
                                <div className="hidden sm:block">
                                    <UTCOffsetSpinBox offset={customOffset} setOffset={setCustomOffset} />
                                </div>
                                <button onClick={onClose} className="flex items-center gap-1 sm:gap-2 px-3 sm:px-4 py-1.5 sm:py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition-colors text-xs sm:text-sm font-semibold shadow-sm">
                                    <Icon name="search" size={16} /> <span className="hidden sm:inline">Search / Map</span>
                                </button>
                            </div>
                        </div>

                        {/* Graph Area */}
                        <div 
                            className="flex-1 relative bg-sky-100 cursor-crosshair overflow-hidden"
                            ref={containerRef}
                            onMouseMove={handleMouseMove}
                            onMouseLeave={() => setCursor({ ...cursor, active: false })}
                            // Desktop Controls
                            onWheel={(e) => {
                                e.preventDefault();
                                const delta = e.deltaY > 0 ? 1.2 : 0.8;
                                if (e.ctrlKey) {
                                    setPanOffset(p => p + (e.deltaY > 0 ? -1 : 1) * zoomLevel / 10);
                                } else {
                                    setZoomLevel(z => Math.max(6, Math.min(168, z * delta)));
                                }
                            }}
                            // Mobile Touch Controls
                            onTouchStart={handleTouchStart}
                            onTouchMove={handleTouchMove}
                            onTouchEnd={handleTouchEnd}
                        >
                            {dataPoints.length > 0 && (
                                <svg className="w-full h-full absolute top-0 left-0 pointer-events-none">
                                    {nightZones.map((zone, i) => {
                                        // Night zones are in UTC. We plot their UTC start/end times.
                                        const x1 = mapX(zone.start);
                                        const x2 = mapX(zone.end);
                                        // Simple check to ensure the zone is visible in the current window
                                        if (x2 < 0 || x1 > width) return null; 
                                        return <rect key={i} x={x1} y="0" width={Math.max(0, x2 - x1)} height="100%" fill="#334155" opacity="0.6" />;
                                    })}
                                    <line x1="0" y1={mapY(refStation.datum||0)} x2="100%" y2={mapY(refStation.datum||0)} stroke="#94a3b8" strokeWidth="1" strokeDasharray="4" opacity="0.5" />
                                    {/* FIX: Draw 'MEAN LEVEL' label 5px *above* the actual mean line, using dy offset */}
                                    <text x="10" y={mapY(refStation.datum||0)} dy="-5" fill="#64748b" fontSize="10" fontWeight="bold" opacity="0.8">MEAN LEVEL</text>
                                    
                                    {/* X-axis time labels: Adjusted based on zoom */}
                                    {dataPoints.filter((_, i) => {
                                        // Use a tighter interval on mobile
                                        const intervalHours = width < 640 ? 4 : 6; // 4 hours on mobile, 6 hours on desktop
                                        const interval = Math.max(1, Math.floor(zoomLevel / intervalHours)); // Adjust interval based on zoom
                                        return i % (interval * 4) === 0; // 4 steps per hour (15-min)
                                    }).map((p, i) => { 
                                         // FIX: Place tick marks and text relative to the bottom margin
                                         return (
                                         <g key={i} transform={`translate(${mapX(p.time)}, ${height - Y_BOTTOM_MARGIN})`}> 
                                             <line y1="-5" y2="0" stroke="#94a3b8" /> 
                                             <text fill="#475569" fontSize="10" fontWeight="bold" textAnchor="middle" y="15">{formatStationTime(p.time, displayOffset)}</text>
                                         </g>
                                         );
                                    })}
                                    
                                    <path d={pathD} fill="none" stroke="#dc2626" strokeWidth="3" />
                                    
                                    {/* Crosshair */}
                                    {cursor.active && (
                                        <g>
                                            <line x1={cursor.x} y1="0" x2={cursor.x} y2="100%" stroke="#475569" strokeWidth="1" strokeDasharray="4" />
                                            <line x1="0" y1={cursor.y} x2="100%" y2={cursor.y} stroke="#475569" strokeWidth="1" strokeDasharray="4" />
                                            <circle cx={cursor.x} cy={cursor.y} r="5" fill="#dc2626" stroke="white" strokeWidth="2" />
                                        </g>
                                    )}
                                </svg>
                            )}
                            {/* Moon Phase Display in the top right corner of the graph area */}
                            <MoonPhaseDisplay time={cursor.time || cursor.initialTime} />
                            
                            <div className="absolute bottom-4 left-4 bg-white/90 px-3 py-1.5 rounded text-[10px] text-slate-500 pointer-events-none border border-slate-200 shadow-sm font-medium hidden sm:block">
                                Scroll to Zoom, Ctrl+Scroll to Pan • Dark areas indicate Night
                            </div>
                            <div className="absolute bottom-4 left-4 bg-white/90 px-3 py-1.5 rounded text-[10px] text-slate-500 pointer-events-none border border-slate-200 shadow-sm font-medium sm:hidden">
                                Drag to Pan, Pinch to Zoom • Dark areas indicate Night
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- APP SHELL (Updated for Mobile Layout) ---
        const App = () => {
            const [stations, setStations] = useState([]);
            const [mapInstance, setMapInstance] = useState(null);
            const [clickedLocation, setClickedLocation] = useState(null);
            const [nearbyStations, setNearbyStations] = useState([]);
            const [selectedStation, setSelectedStation] = useState(null);
            const [loading, setLoading] = useState(true);
            // Time zone state initialized from cache
            const [customOffset, setCustomOffset] = useState(getCachedOffset); 

            // Function to safely attempt file fetching, checking local first, then remote URL
            const fetchFile = async (localPath, remoteName) => {
                let data = null; // Changed to 'data' to hold object or text

                // 1. Try local path first
                try {
                    let response = await fetch(localPath);
                    if (response.ok) {
                        // Special handling for JSON files
                        if (remoteName.endsWith('.json')) {
                            // Try parsing as JSON first, if fails, return raw text anyway
                            try {
                                return await response.json();
                            } catch (e) {
                                console.warn(`Local JSON parsing failed for ${localPath}. Returning raw text.`, e);
                                return await response.text();
                            }
                        }
                        data = await response.text();
                    }
                } catch (e) {
                    // We expect this to fail due to file:// restrictions.
                }

                // 2. If local failed, try remote URL using a CORS proxy
                if (data === null) {
                    const remoteUrl = `http://xaxero.com/tides/${remoteName}`;
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(remoteUrl)}`;
                    try {
                        let response = await fetch(proxyUrl);
                        if (response.ok) {
                            console.log(`Successfully fetched remote file via CORS proxy: ${remoteUrl}`);
                            // Special handling for JSON files
                            if (remoteName.endsWith('.json')) {
                                return await response.json();
                            }
                            data = await response.text();
                        } else {
                             console.warn(`Remote fetch via proxy failed for ${remoteUrl}: HTTP status ${response.status}`);
                        }
                    } catch (e) {
                        console.error(`Remote fetch completely failed for ${remoteUrl}:`, e.message);
                    }
                }
                
                return data; // Returns content (string or object) or null
            };

            useEffect(() => {
                const loadFiles = async () => {
                    // --- 1. Fetch all file contents asynchronously ---
                    
                    const mscPromise = fetchFile('./harm_msc', 'harm_msc');
                    const idxPromise = fetchFile('./harmonic.idx', 'harmonic.idx')
                        .then(res => res !== null ? res : fetchFile('./harmonic_idx', 'harmonic_idx')); 
                    
                    // Priority load JSON
                    const harmJsonPromise = fetchFile('./harmonic.json', 'harmonic.json');
                    
                    // Fallback to CSV loading (for backwards compatibility if JSON fails)
                    const harmCsvPromise = fetchFile('./harmonics', 'harmonics')
                        .then(res => res !== null ? res : fetchFile('./harmonics.csv', 'harmonics.csv'));
                    


                    const [mscContent, idxContent, harmJsonContent, harmCsvContent] = await Promise.all([
                        mscPromise,
                        idxPromise,
                        harmJsonPromise,
                        harmCsvPromise
                    ]);
                    
                    // The station map will now use the normalized name as the key
                    const stationMap = new Map();
                    let mscStations = [];
                    let idxStations = [];
                    let jsonStations = [];
                    let csvStations = [];
                    
                    try {
                        
                        // --- 2. Load JSON Data (Highest Priority) ---
                        if (harmJsonContent) {
                            jsonStations = parseHarmonicsJSON(harmJsonContent);
                            jsonStations.forEach(s => {
                                const key = normalizeKey(s.name);
                                stationMap.set(key, { ...s, originalName: s.name, name: s.name });
                            });
                        }

                        // --- 3. Load CSV Data (Fallback) ---
                        if (harmCsvContent && jsonStations.length === 0) {
                            csvStations = parseHarmonicsCSV(harmCsvContent);
                            csvStations.forEach(s => {
                                const key = normalizeKey(s.name);
                                stationMap.set(key, { ...s, originalName: s.name, name: s.name });
                            });
                        }
                        
                        // --- 4. Load Legacy Harmonic Constants (harm_msc) ---
                        if (mscContent) {
                            mscStations = parseHarmMsc(mscContent);
                            mscStations.forEach(s => {
                                const key = normalizeKey(s.name);
                                const existing = stationMap.get(key);
                                
                                if (existing) {
                                    // Merge: Only update constituents if the comprehensive data lacks them
                                    if (!existing.constituents || existing.constituents.length === 0) {
                                        stationMap.set(key, { ...existing, ...s });
                                    }
                                } else {
                                     stationMap.set(key, { ...s, originalName: s.name });
                                }
                            });
                        }

                        // --- 5. Load Old Subordinate Offsets (harmonic.idx) ---
                        if (idxContent) {
                            idxStations = parseHarmonicIdx(idxContent);
                            idxStations.forEach(s => {
                                const key = normalizeKey(s.name);
                                const existing = stationMap.get(key);
                                
                                if (existing) {
                                    // Merge subordinate data, retaining current constituents
                                    stationMap.set(key, { ...existing, ...s });
                                } else {
                                    stationMap.set(key, { ...s, originalName: s.name });
                                }
                            });
                        }


                        const allData = Array.from(stationMap.values()).filter(s => s.coordinates && s.coordinates.lat !== 0 && s.name);
                        
                        // --- DEBUG REPORT ---
                        console.groupCollapsed("Tide Data Load Report (Check Console)");
                        console.log(`1. harmonic.json (Loaded): ${jsonStations.length}`);
                        console.log(`2. harmonics/harmonics.csv (Loaded): ${csvStations.length}`);
                        console.log(`3. harm_msc (Legacy Ref Stations loaded): ${mscStations.length}`);
                        console.log(`4. harmonic.idx/harmonic_idx (Old Subordinate Refs loaded): ${idxStations.length}`);
                        console.log(`Total Unique Stations with Coordinates: ${allData.length}`);
                        
                        // Example data check: Check for known Reference Stations
                        const checkStations = ["Aba, Nagasaki, Japan", "New York, New York", "Reedy Point, Delaware", "Lisbon", "Cape Town"];
                        console.log("\n--- Harmonic Constants Status (from all sources) ---");
                        checkStations.forEach(rawName => {
                            const key = normalizeKey(rawName);
                            const station = stationMap.get(key);
                            const constCount = (station && station.constituents) ? station.constituents.length : 0;
                            const status = (constCount > 0) ? `FOUND (${constCount} constituents)` : 'MISSING';
                            console.log(`[${rawName}]: ${status}`);
                        });
                        
                        const activeSubordinates = allData.filter(s => s.type === 'subordinate' && s.refName);
                        
                        console.log(`\nActive Subordinate Stations to be calculated: ${activeSubordinates.length}`);

                        // Check missing reference constants for the loaded subordinates
                        const missingRefs = activeSubordinates.filter(s => {
                            const refKey = normalizeKey(s.refName);
                            const actualRef = stationMap.get(refKey);

                            return !actualRef || !actualRef.constituents || actualRef.constituents.length === 0;
                        });

                        if (missingRefs.length > 0) {
                             console.log(`\nWARNING: ${missingRefs.length} subordinate stations are missing their *Reference Harmonic Constants* in the consolidated data.`);
                             console.log("Example Missing References (Cannot calculate tides accurately):", missingRefs.slice(0, 5).map(s => s.name + ' (needs ' + s.refName + ')'));
                        } else if (activeSubordinates.length > 0) {
                            console.log("\nSUCCESS: All loaded subordinate stations have a linked reference station with harmonic constants.");
                        }

                        // --- Lisbon Debugging ---
                        const lisbonKey = normalizeKey("Lisbon");
                        const lisbonStation = stationMap.get(lisbonKey);
                        if (lisbonStation && lisbonStation.constituents.length > 0) {
                            console.groupCollapsed("\nLisbon Constituent Data (Amplitude [A], Phase [E])");
                            lisbonStation.constituents.forEach(c => {
                                console.log(`${c.name}: A=${c.amp.toFixed(4)}, E=${c.phase.toFixed(4)}`);
                            });
                            console.groupEnd();
                        } else {
                            console.log("\nLisbon Constituent Data: NOT FOUND or has zero constituents.");
                        }
                        
                        console.groupEnd();
                        
                        setStations(allData);
                        setLoading(false);
                    } catch (e) { 
                        console.error("Error during file parsing/merging:", e);
                        setLoading(false);
                    }
                };
                loadFiles();
            }, []);

            useEffect(() => {
                if (stations.length === 0 || mapInstance) return;
                
                const mapElement = document.getElementById('map');
                if (!mapElement) return;

                const map = L.map(mapElement, { center: [20, 0], zoom: 3, zoomControl: false, attributionControl: false });
                
                L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)' }).addTo(map);
                L.control.zoom({ position: 'bottomright' }).addTo(map);
                map.on('click', e => setClickedLocation(e.latlng));
                
                map.invalidateSize(); 

                setMapInstance(map);
            }, [stations]);

            useEffect(() => {
                if (!clickedLocation || !mapInstance) return;
                mapInstance.eachLayer(l => { 
                    if (l instanceof L.Marker || l instanceof L.Circle) mapInstance.removeLayer(l); 
                });
                
                const nearby = stations.filter(s => {
                    if (!s.coordinates) return false;
                    return haversineDistance(clickedLocation.lat, clickedLocation.lng, s.coordinates.lat, s.coordinates.lon) <= 60;
                });
                setNearbyStations(nearby);

                nearby.forEach(s => {
                    const refKey = normalizeKey(s.refName || s.name);
                    const refStation = s.type === 'subordinate' ? stations.find(item => normalizeKey(item.name) === refKey) : s;

                    const isReference = s.type === 'reference' && s.constituents && s.constituents.length > 0;
                    
                    const isSubordinateReady = s.type === 'subordinate' && s.offsets && refStation && refStation.datum !== undefined && refStation.constituents && refStation.constituents.length > 0;
                    
                    const isPlottable = isReference || isSubordinateReady;

                    const status = isPlottable ? 'Ready' : 'Data Missing';
                    const statusClass = isPlottable ? 'text-green-600' : 'text-red-500';

                    return (
                        L.marker([s.coordinates.lat, s.coordinates.lon], { title: s.name }).addTo(mapInstance).on('click', () => setSelectedStation(s)).bindPopup(`
                            <div class="font-bold text-slate-800">${s.name}</div>
                            <div class="text-xs ${statusClass} mt-1">Status: ${status}</div>
                            ${s.type === 'subordinate' ? `<div class="text-xs text-slate-500">Ref: ${s.refName}</div>` : ''}
                            `, { className: 'custom-popup' })
                    );
                });
                
                mapInstance.setView(clickedLocation, mapInstance.getZoom() < 5 ? 5 : mapInstance.getZoom());
            }, [clickedLocation, stations]);

            const handleUpload = (files) => {
                let filesProcessed = 0;
                const totalFiles = files.length;
                
                const stationMap = new Map(Array.from(stations.values()).map(s => [normalizeKey(s.name), s]));
            
                const updateStations = () => {
                    if (filesProcessed === totalFiles) {
                        setStations(Array.from(stationMap.values()).filter(s => s.coordinates && s.coordinates.lat !== 0 && s.name));
                        setLoading(false); 
                    }
                };

                setLoading(true);

                Array.from(files).forEach(f => {
                    const r = new FileReader();
                    r.onload = e => {
                        let parsedData = [];
                        if (f.name.includes("harmonic.json")) {
                            // JSON upload handler
                            try {
                                parsedData = parseHarmonicsJSON(e.target.result);
                            } catch (error) {
                                console.error("Error processing uploaded JSON file:", error);
                                // Changed from alert() to console error to respect the no-alert rule
                            }
                        }
                         else if (f.name.includes("harmonics") || f.name.includes("harmonics.csv")) {
                            parsedData = parseHarmonicsCSV(e.target.result);
                        } else if (f.name.includes("harm_msc")) {
                            parsedData = parseHarmMsc(e.target.result);
                        } else if (f.name.includes("harmonic.idx") || f.name.includes("harmonic_idx")) {
                            parsedData = parseHarmonicIdx(e.target.result);
                        }

                        parsedData.forEach(s => {
                            const key = normalizeKey(s.name);
                            const existing = stationMap.get(key);
                            
                            // For JSON/CSV, data is comprehensive, prioritize it.
                            if (f.name.includes("harmonic.json") || f.name.includes("harmonics.csv") || f.name.includes("harmonics")) {
                                stationMap.set(key, { ...existing, ...s });
                            } 
                            // For legacy files, merge carefully
                            else if (existing) {
                                if (!existing.constituents || existing.constituents.length === 0) {
                                    stationMap.set(key, { ...existing, ...s });
                                } else {
                                    stationMap.set(key, { ...existing, ...s, constituents: existing.constituents });
                                }
                            } else {
                                stationMap.set(key, s);
                            }
                        });

                        filesProcessed++;
                        updateStations();
                    };
                    r.onerror = (err) => {
                        console.error("Error reading file:", f.name, err);
                        filesProcessed++;
                        updateStations();
                    }
                    r.readAsText(f);
                });
                
                if (totalFiles === 0) setLoading(false);
            };

            if (loading) return <div className="h-screen flex items-center justify-center bg-slate-50 text-slate-600 font-medium animate-pulse">Initializing Tide Database...</div>;

            return (
                <div className="h-screen relative bg-slate-100"> 
                    {/* Full-screen Map Container. CSS styling (width/height 100vw/100vh) is in the <style> block. */}
                    <div id="map" className="absolute inset-0 outline-none"></div>

                    {/* Display Load Prompt only if no stations are loaded, using the raw file names */}
                    {stations.length === 0 && (
                        <div className="absolute inset-0 z-50 bg-slate-900/80 flex flex-col items-center justify-center backdrop-blur-sm" onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault(); handleUpload(e.dataTransfer.files);}}>
                            <div className="border-2 border-dashed border-slate-500 rounded-xl p-12 text-center bg-white shadow-2xl">
                                <Icon name="upload" size={48} className="mx-auto text-slate-400 mb-4" />
                                <h1 className="2xl font-bold text-slate-800 mb-2">Load Tide Data Files</h1>
                                <p className="text-slate-500">Drag & Drop harmonic.json (or legacy files)</p>
                            </div>
                        </div>
                    )}

                    {/* Sidebar: Full width on mobile, fixed left on desktop */}
                    <div className="absolute top-0 left-0 right-0 sm:top-6 sm:left-6 sm:right-auto z-[2000] panel p-4 rounded-b-lg sm:rounded-lg w-full sm:w-80 max-h-[90vh] flex flex-col">
                        <div className="flex justify-between items-center mb-4 shrink-0">
                            <img src="https://xaxero.com/images/XaxeroLogoSansSloganCopy.png" className="h-6" alt="Xaxero Marine Tides" />
                            <span className="text-xs bg-slate-100 px-2 py-1 rounded text-slate-600 border border-slate-200">{stations.length} Stations</span>
                        </div>
                        
                        {/* Nearby Stations List */}
                        {clickedLocation ? (
                            <div className="flex-1 flex flex-col min-h-0 mt-4">
                                <div className="text-[10px] font-bold text-blue-600 uppercase tracking-wider mb-2 shrink-0">Nearby (60 Miles)</div>
                                {nearbyStations.length === 0 ? <div className="text-sm text-slate-500 text-center py-4 italic">No stations found in this sector.</div> : 
                                    <div className="overflow-y-auto pr-1 min-h-0" style={{ maxHeight: 'calc(90vh - 120px)' }}> {/* Added Max Height for scrolling */}
                                        {nearbyStations.map((s,i) => {
                                            const refKey = normalizeKey(s.refName || s.name);
                                            const refStation = s.type === 'subordinate' ? stations.find(item => normalizeKey(item.name) === refKey) : s;

                                            const isReference = s.type === 'reference' && s.constituents && s.constituents.length > 0;
                                            
                                            const isSubordinateReady = s.type === 'subordinate' && s.offsets && refStation && refStation.datum !== undefined && refStation.constituents && refStation.constituents.length > 0;
                                            
                                            const isPlottable = isReference || isSubordinateReady;

                                            const status = isPlottable ? 'Ready' : 'Data Missing';
                                            const statusClass = isPlottable ? 'text-green-600' : 'text-red-500';

                                            return (
                                                <button key={i} onClick={()=>setSelectedStation(s)} className="w-full text-left text-xs p-3 bg-slate-50 hover:bg-blue-50 rounded mb-1 text-slate-700 border border-slate-200 hover:border-blue-200 transition-colors flex justify-between items-center">
                                                    <span>{s.name}</span>
                                                    {!isPlottable && <span className="text-red-500 text-[10px] font-semibold">Data Missing</span>}
                                                </button>
                                            );
                                        })}
                                    </div>
                                }
                            </div>
                        ) : <div className="text-xs text-slate-500 text-center py-4 bg-slate-50 rounded border border-dashed border-slate-200">Click map to search area</div>}
                    </div>

                    {selectedStation && <TideGraph 
                                            station={selectedStation} 
                                            allStations={stations} 
                                            onClose={()=>setSelectedStation(null)} 
                                            customOffset={customOffset}
                                            setCustomOffset={setCustomOffset}
                                        />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
