    <style>
        :root {
            --paper: #ffffff;
            --ink: #000000;
        }

        body {
            background-color: #1a1a1a;
            color: #333;
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }

        /* Full Screen Fax Container */
        #fax-container {
            position: relative;
            background-color: var(--paper);
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* The canvas fills available space */
        .canvas-wrapper {
            position: relative;
            flex-grow: 1;
            overflow: hidden;
            background-color: var(--paper);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background-color: var(--paper);
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Scanline Overlay */
        .scanline-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,

<body>

    <div id="fax-container">
        <div class="scanline-overlay"></div>
        
        <div class="canvas-wrapper">
            <canvas id="weatherCanvas" width="1200" height="900"></canvas>
            <div id="loading-overlay">
                <div class="loading-text">ACQUIRING SATELLITE DATA...</div>
                <div style="font-size: 1rem; margin-top: 10px;">DOWNLOADING GFS/ECMWF MODEL & WORLD VECTOR MAP</div>
            </div>
        </div>

        <div class="controls">

                <label>Latitude</label>

            </div>

            <div class="control-group">

                    <option value="surface_0">SURFACE ANAL</option>
                    <option value="surface_12">SURFACE +12H</option>
                    <option value="surface_24">SURFACE +24H</option>
                    <option value="rain_12">RAIN/SURFACE +12H</option>
                    <option value="rain_24">RAIN/SURFACE +24H</option>
                    <option value="500hpa_0">500MB ANAL</option>

                    <option value="500hpa_24">500MB +24H</option>
                </select>
            </div>

            <div class="control-group">
                <label>Range (NM)</label>

                    <option value="30">2000 (Detailed)</option>
                    <option value="50">4000 (Regional)</option>
                </select>
            </div>
            
            <button id="gpsBtn" title="Use GPS Position">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
                </svg>
            </button>

            <div style="width: 1px; height: 30px; background: #ccc; margin: 0 10px;"></div>

            <button id="receiveBtn">
                <span class="status-led" id="statusLed"></span>
                INITIATE FAX
            </button>
        </div>
    </div>

    <script>
        /**
         * Xaxero Weather Fax 2026 - Real Data Edition
         * Features: Persistence, Retro Scan, Prognosis Selection, 500hPa Heights, Rain Overlay, Smoothed Contours
         */

        const canvas = document.getElementById('weatherCanvas');
        const ctx = canvas.getContext('2d');
        const latInput = document.getElementById('latInput');
        const lonInput = document.getElementById('lonInput');
        const rangeInput = document.getElementById('rangeInput');
        const forecastInput = document.getElementById('forecastInput');
        const gpsBtn = document.getElementById('gpsBtn');
        const receiveBtn = document.getElementById('receiveBtn');
        const statusLed = document.getElementById('statusLed');
        const loadingOverlay = document.getElementById('loading-overlay');

        // Configuration
        const CANVAS_WIDTH = 1200;
        const CANVAS_HEIGHT = 900;
        const DATA_PADDING_DEG = 8; // Extra padding for safe contours off-screen
        
        // Dynamic Grid Settings (Modified by Zoom level)
        let FETCH_RES = 3; 

        // Scan Animation Settings
        const SCAN_SPEED = 4; // Pixels per frame
        let isReceiving = false;
        let scanY = 0;
        
        let worldData = null; 

        // Buffer Canvas (Double Buffering)
        const bufferCanvas = document.createElement('canvas');
        bufferCanvas.width = CANVAS_WIDTH;
        bufferCanvas.height = CANVAS_HEIGHT;
        const bufferCtx = bufferCanvas.getContext('2d');

        // --- Persistence Logic ---
        
        function loadSettings() {
            const savedLat = localStorage.getItem('xaxero_lat');
            const savedLon = localStorage.getItem('xaxero_lon');
            const savedRange = localStorage.getItem('xaxero_range');
            const savedForecast = localStorage.getItem('xaxero_forecast');

            // Set defaults if nothing saved, otherwise load
            latInput.value = savedLat !== null ? savedLat : "38";
            lonInput.value = savedLon !== null ? savedLon : "-40";
            if (savedRange) rangeInput.value = savedRange;
            if (savedForecast) forecastInput.value = savedForecast;
        }

        function saveSettings() {
            localStorage.setItem('xaxero_lat', latInput.value);
            localStorage.setItem('xaxero_lon', lonInput.value);
            localStorage.setItem('xaxero_range', rangeInput.value);
            localStorage.setItem('xaxero_forecast', forecastInput.value);
        }

        // Attach listeners for persistence
        [latInput, lonInput, rangeInput, forecastInput].forEach(el => {
            el.addEventListener('change', saveSettings);
        });

        // --- Data Fetching ---

        async function initWorldMap() {
            if (worldData) return;
            try {
                const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json');
                if(!response.ok) throw new Error("Map fetch failed");
                worldData = await response.json();
            } catch (e) {
                console.error("Failed to load map data:", e);
                alert("Error loading coastline database. Check internet connection.");
            }
        }

        // --- Grid Response Cache ---
        // Open-Meteo counts quota per location, so one chart costs ~400 calls.
        // Caching the raw hourly grid for an hour makes re-renders, offset changes
        // (H+0/12/24) and surface/rain switches effectively free.
        const weatherCache = new Map(); // session cache
        const WEATHER_CACHE_TTL_MS = 3 * 60 * 60 * 1000; // synoptic charts: model runs update every 1-6h

        // Each dataset has a distinct variable set, so it gets its own cache entry.
        // A 'rain' grid is a superset of 'sfc' and can also serve surface charts.
        function gridDataset(productType) {
            if (productType === '500hpa') return '500hpa';
            if (productType === 'rain') return 'rain';
            return 'sfc';
        }

        function gridCacheKey(dataset, centerLat, centerLon, radiusDeg) {
            return `${dataset}_${centerLat.toFixed(1)}_${centerLon.toFixed(1)}_${radiusDeg}`;
        }

        function readWeatherCache(keys) {
            const now = Date.now();
            for (const key of keys) {
                const mem = weatherCache.get(key);
                if (mem && now - mem.fetchedAt < WEATHER_CACHE_TTL_MS) {
                    return { key, data: mem.data };
                }
                try {
                    const stored = JSON.parse(localStorage.getItem('wx_' + key));
                    if (stored && now - stored.fetchedAt < WEATHER_CACHE_TTL_MS) {
                        weatherCache.set(key, stored);
                        return { key, data: stored.data };
                    }
                    localStorage.removeItem('wx_' + key);
                } catch (e) { /* corrupted entry - refetch */ }
            }
            return null;
        }

        function writeWeatherCache(key, data) {
            const entry = { fetchedAt: Date.now(), data };
            weatherCache.set(key, entry);
            try {
                localStorage.setItem('wx_' + key, JSON.stringify(entry));
            } catch (e) { /* storage full - session cache still works */ }
        }

        /**
         * Fetches weather data in batches to avoid URL length limits.
         * @param {string} productType - 'surface', 'rain' or '500hpa'
         * @param {number} hourOffset - 0, 12, 24
         */
        async function fetchWeatherData(centerLat, centerLon, radiusDeg, productType, hourOffset) {
            // 1. Determine Dynamic Resolution
            // Open-Meteo quota is counted per location (x variables x days), so point
            // count is the dominant cost. Synoptic-scale fax charts only resolve large
            // features, and the interpolation/smoothing passes rebuild smooth fields,
            // so a coarse input grid is sufficient. Target: <=200 points per chart.
            if (radiusDeg <= 30) {
                FETCH_RES = 6.0; // ~360nm — ~196 pts for a 30deg range (was 4.0 -> ~400 pts)
            } else if (radiusDeg <= 60) {
                FETCH_RES = 12.0; // ~720nm — ~169 pts (was 8.0 -> ~324 pts)
            } else {
                FETCH_RES = 15.0; // ~900nm (was 10.0)
            }
            
            console.log(`Fetch Resolution: ${FETCH_RES}° based on range ${radiusDeg}`);

            // 2. Define Bounds
            const totalRadius = radiusDeg + DATA_PADDING_DEG;
            const minLat = centerLat - totalRadius;
            const maxLat = centerLat + totalRadius;
            const minLon = centerLon - totalRadius;
            const maxLon = centerLon + totalRadius;

            // 3. Generate Coordinate Grid
            const coords = [];
            const gridMeta = {
                minLat, maxLat, minLon, maxLon,
                rows: 0, cols: 0,
                lats: [], lons: []
            };

            // Calculate Grid Dimensions
            // We do this to ensure we capture the grid metadata accurately for reconstruction
            for (let lat = minLat; lat <= maxLat; lat += FETCH_RES) {
                let l = Math.max(-90, Math.min(90, lat));
                if (!gridMeta.lats.includes(l)) gridMeta.lats.push(l);
            }
            
            for (let lat = minLat; lat <= maxLat; lat += FETCH_RES) {
                gridMeta.rows++;
                let c = 0;
                for (let lon = minLon; lon <= maxLon; lon += FETCH_RES) {
                    let l = Math.max(-90, Math.min(90, lat));
                    let lng = lon; 
                    if (lng > 180) lng -= 360;
                    if (lng < -180) lng += 360;
                    coords.push({lat: l, lon: lng});
                    c++;
                }
                gridMeta.cols = c;
            }

            // 4. Batching Logic
            // API URLs fail around 2000-8000 chars. Safe bet is ~250 coords per call.
            const BATCH_SIZE = 250;
            const chunks = [];
            
            for (let i = 0; i < coords.length; i += BATCH_SIZE) {
                chunks.push(coords.slice(i, i + BATCH_SIZE));
            }

            console.log(`Generated ${coords.length} points. Processing in ${chunks.length} batch(es).`);

            // Select variables — request only what the product actually renders,
            // since quota scales with variable count. Precipitation is only drawn
            // on rain charts, and 500hPa needs only height + wind.
            const dataset = gridDataset(productType);
            let variables = "";
            if (dataset === '500hpa') {
                variables = "geopotential_height_500hPa,wind_speed_500hPa,wind_direction_500hPa";
            } else if (dataset === 'rain') {
                variables = "pressure_msl,cloud_cover,wind_speed_10m,wind_direction_10m,precipitation";
            } else {
                variables = "pressure_msl,cloud_cover,wind_speed_10m,wind_direction_10m";
            }

            // 5. Fetch Batches Sequentially (Throttled to prevent 429 Errors)
            //    We only ever draw ONE hour, so request exactly that timestamp
            //    (start_hour == end_hour) instead of a multi-day series.
            const targetIso = new Date(Date.now() + hourOffset * 3600 * 1000)
                .toISOString().slice(0, 13); // "YYYY-MM-DDTHH"
            // Cache key includes the target hour: each chart is a distinct dataset
            const cacheKey = gridCacheKey(dataset, centerLat, centerLon, radiusDeg) + '_' + targetIso;
            // A rain grid is a superset of sfc, so surface charts may reuse it
            const keysToTry = dataset === 'sfc'
                ? [cacheKey, gridCacheKey('rain', centerLat, centerLon, radiusDeg) + '_' + targetIso]
                : [cacheKey];
            const cacheHit = readWeatherCache(keysToTry);
            const combinedData = cacheHit ? cacheHit.data : [];
            const MAX_RETRIES = 3;

            if (cacheHit) {
                console.log(`Using cached grid (${cacheHit.data.length} points, key ${cacheHit.key}).`);
            }

            try {
                if (!cacheHit) {
                // Update loading text to show progress
                const loadingTextEl = document.querySelector('#loading-overlay .loading-text');
                const originalText = loadingTextEl ? loadingTextEl.innerText : "ACQUIRING SATELLITE DATA...";

                for (let i = 0; i < chunks.length; i++) {
                    const chunk = chunks[i];

                    if(loadingTextEl) {
                        loadingTextEl.innerText = `DOWNLOADING PACKET ${i+1}/${chunks.length}...`;
                    }

                    const latStr = chunk.map(c => c.lat.toFixed(2)).join(',');
                    const lonStr = chunk.map(c => c.lon.toFixed(2)).join(',');
                    // Single point in time: one timestamp per location, not a range
                    const url = `https://api.open-meteo.com/v1/forecast?latitude=${latStr}&longitude=${lonStr}&hourly=${variables}&wind_speed_unit=kn&start_hour=${targetIso}:00&end_hour=${targetIso}:00`;
                    
                    // Retry with exponential backoff
                    let batchResult = null;
                    for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
                        const res = await fetch(url);
                        if (res.ok) {
                            batchResult = await res.json();
                            break;
                        } else if (res.status === 429) {
                            const delay = 2000 * Math.pow(2, attempt); // 2s, 4s, 8s
                            console.warn(`Rate limit hit on batch ${i+1}, retry ${attempt+1} in ${delay}ms`);
                            if(loadingTextEl) loadingTextEl.innerText = `RATE LIMITED - RETRYING IN ${delay/1000}s...`;
                            await new Promise(r => setTimeout(r, delay));
                        } else {
                            throw new Error(`Batch ${i+1} failed: HTTP ${res.status}`);
                        }
                    }
                    if (!batchResult) throw new Error(`Batch ${i+1} failed after ${MAX_RETRIES} retries (rate limited).`);
                    
                    const batchArray = Array.isArray(batchResult) ? batchResult : [batchResult];
                    
                    // Validate batch size matches expected chunk size
                    if (batchArray.length !== chunk.length) {
                        console.warn(`Batch ${i+1}: expected ${chunk.length} results, got ${batchArray.length}`);
                    }
                    
                    combinedData.push(...batchArray);

                    // Gentle throttle between requests
                    await new Promise(r => setTimeout(r, 350));
                }

                if(loadingTextEl) loadingTextEl.innerText = originalText;

                writeWeatherCache(cacheKey, combinedData);
                } // end if (!cacheHit)

                // 6. Process Time & Structure
                // The request asked for a single timestamp, so each location has
                // exactly one hourly entry. Find it by matching targetIso (index 0
                // in practice) so cached grids stay correct too.
                const now = new Date();
                let targetIdx = 0;
                let validTimeString = new Date(targetIso + ":00Z").toUTCString().replace("GMT", "Z");

                const firstHourly = combinedData.find(d => d && d.hourly && d.hourly.time);
                if (firstHourly) {
                    const timeArr = firstHourly.hourly.time;
                    const foundIdx = timeArr.findIndex(t => t.slice(0, 13) === targetIso);
                    if (foundIdx !== -1) {
                        targetIdx = foundIdx;
                    } else {
                        console.warn(`Target hour ${targetIso} not in response (${timeArr.length} entries), using first.`);
                    }
                    if (timeArr[targetIdx]) {
                        const isoTime = timeArr[targetIdx] + "Z";
                        validTimeString = new Date(isoTime).toUTCString().replace("GMT", "Z");
                    }
                }

                // Helper: safely read a numeric value, returning fallback if null/undefined/NaN
                function safeNum(val, fallback) {
                    return (val !== null && val !== undefined && !isNaN(val)) ? val : fallback;
                }

                // Map raw data to standardized format
                combinedData.forEach((d, i) => {
                    // Safety check for index alignment
                    if (!coords[i]) return;
                    
                    d.lat = coords[i].lat;
                    d.lon = coords[i].lon;

                    // Always create d.current with safe defaults so downstream code never hits null
                    if (productType === '500hpa') {
                        const defaultHeight = 560;
                        const rawHeight = d.hourly ? d.hourly.geopotential_height_500hPa?.[targetIdx] : null;
                        d.current = {
                            value: safeNum(rawHeight, defaultHeight * 10) / 10, // dam
                            wind_speed: safeNum(d.hourly?.wind_speed_500hPa?.[targetIdx], 0),
                            wind_dir: safeNum(d.hourly?.wind_direction_500hPa?.[targetIdx], 0),
                            cloud: null,
                            precip: 0
                        };
                    } else {
                        d.current = {
                            value: safeNum(d.hourly?.pressure_msl?.[targetIdx], 1013),
                            wind_speed: safeNum(d.hourly?.wind_speed_10m?.[targetIdx], 0),
                            wind_dir: safeNum(d.hourly?.wind_direction_10m?.[targetIdx], 0),
                            cloud: safeNum(d.hourly?.cloud_cover?.[targetIdx], 0),
                            precip: safeNum(d.hourly?.precipitation?.[targetIdx], 0)
                        };
                    }
                });

                return { raw: combinedData, meta: gridMeta, validTime: validTimeString, type: productType };

            } catch (e) {
                console.error(e);
                throw new Error("Satellite Link Unstable (API Batch Failed).");
            }
        }

        // --- Interpolation & Analysis ---

        // metricKey: 'value' (pressure/height) or 'precip'
        function interpolateGrid(weatherData, metricKey) {
            const { raw, meta, type } = weatherData;
            
            // 1. Create 2D Array of raw values
            const rawGrid = [];
            // Default value depends on what we are interpolating
            let defaultVal = 0;
            if (metricKey === 'value') {
                defaultVal = (type === '500hpa') ? 560 : 1013;
            } else if (metricKey === 'precip') {
                defaultVal = 0;
            }

            for(let r=0; r<meta.rows; r++) {
                const row = [];
                for(let c=0; c<meta.cols; c++) {
                    const idx = r * meta.cols + c;
                    let val = defaultVal;
                    if (raw[idx] && raw[idx].current && raw[idx].current[metricKey] !== undefined && raw[idx].current[metricKey] !== null && !isNaN(raw[idx].current[metricKey])) {
                        val = raw[idx].current[metricKey];
                    }
                    row.push(val);
                }
                rawGrid.push(row);
            }

            // 2. Interpolate
            // Because we now have lower resolution data, we need more steps to make it smooth
            const stepsPerCell = 8; // Increased to compensate for coarser fetch resolution
            const newRows = Math.max(1, (meta.rows - 1) * stepsPerCell + 1);
            const newCols = Math.max(1, (meta.cols - 1) * stepsPerCell + 1);
            
            if (newRows <= 0 || newCols <= 0 || isNaN(newRows) || isNaN(newCols)) {
                console.warn("Invalid grid dimensions calculated", newRows, newCols);
                return { values: new Float32Array(0), rows: 0, cols: 0, meta: meta };
            }
            
            const fineGrid = new Float32Array(newRows * newCols);

            for (let r = 0; r < newRows; r++) {
                for (let c = 0; c < newCols; c++) {
                    const rRaw = r / stepsPerCell;
                    const cRaw = c / stepsPerCell;
                    
                    const r0 = Math.floor(rRaw);
                    const c0 = Math.floor(cRaw);
                    const r1 = Math.min(r0 + 1, meta.rows - 1);
                    const c1 = Math.min(c0 + 1, meta.cols - 1);

                    const dr = rRaw - r0;
                    const dc = cRaw - c0;

                    const top = rawGrid[r0][c0] * (1 - dc) + rawGrid[r0][c1] * dc;
                    const bot = rawGrid[r1][c0] * (1 - dc) + rawGrid[r1][c1] * dc;
                    const val = top * (1 - dr) + bot * dr;

                    fineGrid[r * newCols + c] = val;
                }
            }

            return { values: fineGrid, rows: newRows, cols: newCols, meta: meta };
        }

        /**
         * Applies weighted averaging (Gaussian Smoothing) to the grid values.
         * This rounds the contours, removing sharp artifacts from linear interpolation.
         * @param {Object} gridObj - The grid object returned by interpolateGrid
         * @param {number} iterations - How many times to smooth (more = rounder)
         */
        function smoothFieldData(gridObj, iterations = 1) {
            let { values, rows, cols } = gridObj;
            if (rows === 0 || cols === 0) return gridObj;

            // Convolution Kernel (3x3 Gaussian approximation)
            // 1 2 1
            // 2 4 2
            // 1 2 1
            // Divisor: 16
            
            for (let i = 0; i < iterations; i++) {
                const newValues = new Float32Array(values.length);
                
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        // Edge case handling: just copy val if on border to avoid shrinking bounds
                        if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
                            newValues[r * cols + c] = values[r * cols + c];
                            continue;
                        }

                        let sum = 0;
                        
                        // Center
                        sum += values[r * cols + c] * 4;
                        
                        // Orthogonal
                        sum += values[(r-1) * cols + c] * 2;
                        sum += values[(r+1) * cols + c] * 2;
                        sum += values[r * cols + (c-1)] * 2;
                        sum += values[r * cols + (c+1)] * 2;
                        
                        // Diagonal
                        sum += values[(r-1) * cols + (c-1)] * 1;
                        sum += values[(r-1) * cols + (c+1)] * 1;
                        sum += values[(r+1) * cols + (c-1)] * 1;
                        sum += values[(r+1) * cols + (c+1)] * 1;
                        
                        newValues[r * cols + c] = sum / 16;
                    }
                }
                values = newValues;
            }

            gridObj.values = values;
            return gridObj;
        }

        function findSystems(gridObj, type) {
            const { values, rows, cols, meta } = gridObj;
            if(rows === 0 || cols === 0) return [];

            const systems = [];
            // FIX: Range must be small relative to grid size. 
            // Previous code had range=10, which often exceeded the entire grid size, resulting in 0 systems found.
            const range = 5; 

            for (let r = range; r < rows - range; r++) {
                for (let c = range; c < cols - range; c++) {
                    const centerVal = values[r * cols + c];
                    let isMax = true;
                    let isMin = true;

                    // Check neighbors
                    for (let dr = -range; dr <= range; dr++) {
                        for (let dc = -range; dc <= range; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const neighborVal = values[(r + dr) * cols + (c + dc)];
                            if (neighborVal >= centerVal) isMax = false;
                            if (neighborVal <= centerVal) isMin = false;
                        }
                    }

                    if (isMax || isMin) {
                        const lat = meta.minLat + (r / (rows-1)) * (meta.maxLat - meta.minLat);
                        const lon = meta.minLon + (c / (cols-1)) * (meta.maxLon - meta.minLon);

                        let valid = true;
                        
                        // Filter noise - slight variations shouldn't be systems
                        if (type !== '500hpa') {
                            if (isMin && centerVal > 1010) valid = false; // Weak lows
                            if (isMax && centerVal < 1016) valid = false; // Weak highs
                        }

                        // Push system
                        if (valid) {
                            systems.push({
                                type: isMax ? 'H' : 'L',
                                value: Math.round(centerVal),
                                lat: lat,
                                lon: lon
                            });
                        }
                        
                        // Jump forward to avoid bunching systems next to each other
                        c += range; 
                    }
                }
            }
            return systems;
        }

        // --- Drawing Logic ---

        function drawMap(context, centerLat, centerLon, width, height, radiusDeg) {
            if (!worldData) return;

            const projection = d3.geoEquirectangular()
                .center([centerLon, centerLat])
                .translate([width / 2, height / 2])
                .scale((height / (radiusDeg * 2)) * (180 / Math.PI));

            const path = d3.geoPath()
                .projection(projection)
                .context(context);

            // Draw Land
            context.beginPath();
            context.fillStyle = "#f0f0f0"; // Light grey land fill
            context.strokeStyle = "#000000";
            context.lineWidth = 2.5;
            context.lineJoin = "round";
            path(topojson.feature(worldData, worldData.objects.land));
            context.fill();
            context.stroke();

            // Draw Graticule (Lat/Lon Grid)
            const graticule = d3.geoGraticule().step([10, 10]);
            context.beginPath();
            context.lineWidth = 0.5;
            context.strokeStyle = "#555";
            context.setLineDash([4, 4]);
            path(graticule());
            context.stroke();
            context.setLineDash([]); // Reset

            return projection;
        }

        function drawPrecipitation(context, projection, gridObj) {
            const { values, rows, cols, meta } = gridObj;
            if (rows === 0 || cols === 0) return;

            // Define precipitation thresholds
            // 0.5mm = Light rain
            // 4.0mm = Moderate/Heavy rain
            const thresholds = [0.5, 4.0];
            
            const contours = d3.contours()
                .size([cols, rows])
                .smooth(true)
                .thresholds(thresholds)
                (values);

            // Draw contours
            contours.forEach((contour) => {
                context.beginPath();
                
                // GeoJSON processing manually for canvas
                contour.coordinates.forEach(ring => {
                    ring.forEach(polygon => {
                         let first = true;
                         polygon.forEach(coord => {
                             const gx = coord[0];
                             const gy = coord[1];
                             
                             const ptLat = meta.minLat + (gy / (rows-1)) * (meta.maxLat - meta.minLat);
                             const ptLon = meta.minLon + (gx / (cols-1)) * (meta.maxLon - meta.minLon);
                             
                             const projPos = projection([ptLon, ptLat]);
                             
                             if(projPos) {
                                 if (first) {
                                     context.moveTo(projPos[0], projPos[1]);
                                     first = false;
                                 } else {
                                     context.lineTo(projPos[0], projPos[1]);
                                 }
                             }
                         });
                         context.closePath();
                    });
                });

                // Style based on intensity
                // Fax style: Light rain = light grey, Heavy rain = dark grey/black stipple
                if (contour.value >= 4.0) {
                     context.fillStyle = "rgba(0, 0, 0, 0.4)"; 
                     context.fill();
                } else if (contour.value >= 0.5) {
                     context.fillStyle = "rgba(0, 0, 0, 0.15)";
                     context.fill();
                }
            });
        }

        function drawContours(context, projection, gridObj, type) {
            const { values, rows, cols, meta } = gridObj;
            if (rows === 0 || cols === 0) return;

            let thresholds;
            
            if (type === '500hpa') {
                // 500hPa Heights (dam). Range typically 480 - 600 dam. Step 4 dam.
                thresholds = d3.range(460, 620, 4);
            } else {
                // Surface Pressure (hPa). Range 940 - 1060. Step 2 hPa (Requested)
                thresholds = d3.range(940, 1060, 2);
            }

            const contours = d3.contours()
                .size([cols, rows])
                .smooth(true) 
                .thresholds(thresholds) 
                (values);

            context.lineWidth = 1.0; 
            context.strokeStyle = "black";
            context.lineJoin = "round";
            context.lineCap = "round";

            contours.forEach(contour => {
                context.beginPath();
                
                contour.coordinates.forEach(ring => {
                    ring.forEach(polygon => {
                         let first = true;
                         polygon.forEach(coord => {
                             const gx = coord[0];
                             const gy = coord[1];
                             
                             const ptLat = meta.minLat + (gy / (rows-1)) * (meta.maxLat - meta.minLat);
                             const ptLon = meta.minLon + (gx / (cols-1)) * (meta.maxLon - meta.minLon);
                             
                             const projPos = projection([ptLon, ptLat]);
                             
                             if(projPos) {
                                 if (first) {
                                     context.moveTo(projPos[0], projPos[1]);
                                     first = false;
                                 } else {
                                     context.lineTo(projPos[0], projPos[1]);
                                 }
                             }
                         });
                    });
                });
                context.stroke();

                // Labels
                if (contour.coordinates.length > 0) {
                     let shouldLabel = true;
                     // Only label every other line for clarity if density is high
                     if (type !== '500hpa' && contour.value % 8 !== 0) shouldLabel = false; 
                     if (type === '500hpa' && contour.value % 8 !== 0) shouldLabel = false;

                     if (shouldLabel) {
                         const rings = contour.coordinates[0]; 
                         if(rings && rings.length > 0) {
                             const ring = rings[0];
                             const idx = Math.floor(ring.length / 2); // Center of line segment
                             const c = ring[idx];
                             
                             const ptLat = meta.minLat + (c[1] / (rows-1)) * (meta.maxLat - meta.minLat);
                             const ptLon = meta.minLon + (c[0] / (cols-1)) * (meta.maxLon - meta.minLon);
                             const p = projection([ptLon, ptLat]);
                             
                             if(p && p[0] > 50 && p[0] < CANVAS_WIDTH-50 && p[1] > 50 && p[1] < CANVAS_HEIGHT-50) {
                                context.save();
                                context.fillStyle = "white";
                                context.fillRect(p[0]-12, p[1]-8, 24, 16);
                                context.fillStyle = "black";
                                context.font = "bold 12px 'Share Tech Mono'";
                                context.textAlign = "center";
                                context.textBaseline = "middle";
                                context.fillText(Math.floor(contour.value), p[0], p[1]);
                                context.restore();
                             }
                         }
                     }
                }
            });
        }

        function drawStationModels(context, projection, weatherData) {
            const data = weatherData.raw;
            if(!data) return;

            context.lineWidth = 1.5;
            context.strokeStyle = "black";
            context.fillStyle = "black";

            // With higher resolution, we have WAY too many stations.
            // We need to subsample for display (filter) otherwise the map is black with arrows.
            const minPxDistance = 40; 
            const drawnPoints = [];

            data.forEach(pt => {
                if(!pt.current || pt.current.value === undefined) return;
                
                const pos = projection([pt.lon, pt.lat]);
                if(!pos || pos[0] < 0 || pos[0] > CANVAS_WIDTH || pos[1] < 0 || pos[1] > CANVAS_HEIGHT) return;

                // Collision check
                let tooClose = false;
                for(let prev of drawnPoints) {
                    const dist = Math.sqrt(Math.pow(pos[0]-prev[0], 2) + Math.pow(pos[1]-prev[1], 2));
                    if(dist < minPxDistance) {
                        tooClose = true;
                        break;
                    }
                }
                if(tooClose) return;
                drawnPoints.push(pos);


                const windSpeed = pt.current.wind_speed;
                const windDir = pt.current.wind_dir;
                const cloudCover = pt.current.cloud; 

                // 1. Draw Station Circle
                const r = 4;
                context.beginPath();
                context.arc(pos[0], pos[1], r, 0, 2 * Math.PI);
                context.stroke();

                // Fill Oktas (Only for surface)
                if (cloudCover !== null) {
                    const oktas = Math.round((cloudCover / 100) * 8);
                    context.beginPath();
                    if(oktas === 8) {
                         context.arc(pos[0], pos[1], r, 0, 2 * Math.PI);
                         context.fill();
                    } else if (oktas > 0) {
                         context.moveTo(pos[0], pos[1]);
                         context.arc(pos[0], pos[1], r, 0, (Math.PI * 2 * (oktas/8)));
                         context.lineTo(pos[0], pos[1]);
                         context.fill();
                    }
                }

                // 2. Draw Wind Barb
                if (windSpeed >= 5) {
                    const rads = (windDir - 90) * (Math.PI / 180); 
                    const stemLen = 20;
                    const endX = pos[0] + Math.cos(rads) * stemLen;
                    const endY = pos[1] + Math.sin(rads) * stemLen;

                    context.beginPath();
                    context.moveTo(pos[0] + Math.cos(rads)*r, pos[1] + Math.sin(rads)*r);
                    context.lineTo(endX, endY);
                    context.stroke();

                    // Barbs/Pennants
                    let speed = windSpeed;
                    let barbPos = 0; 
                    const barbLen = 7;
                    const barbSpacing = 4;
                    
                    while(speed >= 48) {
                        context.beginPath();
                        context.lineWidth = 4;
                        const bx = endX - Math.cos(rads) * barbPos;
                        const by = endY - Math.sin(rads) * barbPos;
                        context.moveTo(bx, by);
                        context.lineTo(bx + Math.cos(rads - Math.PI/2)*barbLen, by + Math.sin(rads - Math.PI/2)*barbLen);
                        context.stroke();
                        speed -= 50;
                        barbPos += barbSpacing + 2;
                        context.lineWidth = 1.5; 
                    }
                    while(speed >= 8) {
                        context.beginPath();
                        const bx = endX - Math.cos(rads) * barbPos;
                        const by = endY - Math.sin(rads) * barbPos;
                        context.moveTo(bx, by);
                        context.lineTo(bx + Math.cos(rads - Math.PI/2)*barbLen, by + Math.sin(rads - Math.PI/2)*barbLen);
                        context.stroke();
                        speed -= 10;
                        barbPos += barbSpacing;
                    }
                    if(speed >= 3) {
                        context.beginPath();
                        const bx = endX - Math.cos(rads) * barbPos;
                        const by = endY - Math.sin(rads) * barbPos;
                        context.moveTo(bx, by);
                        context.lineTo(bx + Math.cos(rads - Math.PI/2)*(barbLen/2), by + Math.sin(rads - Math.PI/2)*(barbLen/2));
                        context.stroke();
                    }
                }
            });
        }

        function drawSystemLabels(context, projection, systems) {
            context.textAlign = "center";
            context.textBaseline = "middle";

            systems.forEach(sys => {
                const pos = projection([sys.lon, sys.lat]);
                if (pos && pos[0] >= 0 && pos[0] <= CANVAS_WIDTH && pos[1] >= 0 && pos[1] <= CANVAS_HEIGHT) {
                    
                    // Draw Halo for Letter
                    context.font = "bold 32px 'VT323'";
                    context.lineWidth = 5;
                    context.strokeStyle = "white";
                    context.strokeText(sys.type, pos[0], pos[1] - 5);
                    
                    // Draw Letter
                    context.fillStyle = "black"; 
                    context.fillText(sys.type, pos[0], pos[1] - 5);

                    // Draw Halo for Value
                    context.font = "bold 16px 'Share Tech Mono'";
                    context.lineWidth = 4;
                    context.strokeStyle = "white";
                    context.strokeText(sys.value, pos[0], pos[1] + 15);

                    // Draw Value
                    context.fillStyle = "black";
                    context.fillText(sys.value, pos[0], pos[1] + 15);
                }
            });
        }

        function drawHeader(ctx, title, validDateString) {
            // 1. Start Tone Analog (300 Hz Alternating B/W)
            const toneHeight = 12;
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, CANVAS_WIDTH, toneHeight);
            
            ctx.fillStyle = "black";
            for(let y = 0; y < toneHeight; y++) {
                let shift = (y % 2) * 2;
                for(let x = 0; x < CANVAS_WIDTH; x+=4) {
                    ctx.fillRect(x + shift, y, 2, 1);
                }
            }

            // 2. The Header Bar
            const headerY = toneHeight;
            const headerH = 60;
            ctx.fillStyle = "black";
            ctx.fillRect(0, headerY, CANVAS_WIDTH, headerH);
            
            const frameMarkW = CANVAS_WIDTH * 0.05;
            ctx.fillStyle = "white";
            ctx.fillRect(0, headerY, frameMarkW, headerH);

            // 3. Header Text - LEFT SIDE
            ctx.fillStyle = "white";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.font = "bold 32px 'VT323'";
            ctx.fillText("XAXERO WEATHER FAX 2026", frameMarkW + 20, headerY + 20);
            
            // 4. Header Text - RIGHT SIDE
            ctx.textAlign = "right";
            ctx.font = "bold 32px 'VT323'";
            ctx.fillText(title, CANVAS_WIDTH - 25, headerY + 20);

            ctx.font = "16px 'Share Tech Mono'";
            ctx.fillText(`VALID: ${validDateString.toUpperCase()}`, CANVAS_WIDTH - 25, headerY + 45);
            
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, headerY + headerH);
            ctx.lineTo(CANVAS_WIDTH, headerY + headerH);
            ctx.stroke();
        }

        // --- Fax Scanning Animation ---

        function animateScan() {
            if (!isReceiving) return;

            if (scanY < CANVAS_HEIGHT) {
                ctx.drawImage(bufferCanvas, 
                    0, scanY, CANVAS_WIDTH, SCAN_SPEED,
                    0, scanY, CANVAS_WIDTH, SCAN_SPEED
                );
                
                ctx.fillStyle = "#000";
                ctx.fillRect(0, scanY + SCAN_SPEED, CANVAS_WIDTH, 2);

                scanY += SCAN_SPEED;
                requestAnimationFrame(animateScan);
            } else {
                isReceiving = false;
                statusLed.className = "status-led led-active";
                receiveBtn.disabled = false;
                
                ctx.drawImage(bufferCanvas, 
                    0, CANVAS_HEIGHT - SCAN_SPEED, CANVAS_WIDTH, SCAN_SPEED,
                    0, CANVAS_HEIGHT - SCAN_SPEED, CANVAS_WIDTH, SCAN_SPEED
                );
            }
        }

        // --- Core Application Loop ---

        async function startFaxProcess() {
            if (isReceiving) return;

            const lat = parseFloat(latInput.value);
            const lon = parseFloat(lonInput.value);
            const radius = parseInt(rangeInput.value);
            const productStr = forecastInput.value;
            
            // Parse product string "type_offset"
            const parts = productStr.split('_');
            const productType = parts[0]; // 'surface', 'rain', '500hpa'
            const hourOffset = parseInt(parts[1]);

            if (isNaN(lat) || isNaN(lon)) {
                alert("Please enter valid numeric coordinates.");
                return;
            }

            saveSettings();

            loadingOverlay.style.display = 'flex';
            receiveBtn.disabled = true;

            try {
                await initWorldMap();

                // Fetch Real Weather
                // Note: 'rain' uses the same data structure as 'surface' but needs to know it's rain
                // We pass 'rain' if requested, or 'surface' etc.
                const weatherData = await fetchWeatherData(lat, lon, radius, productType, hourOffset);
                
                // Process Data
                // If it's rain, we actually want 2 grids. 
                // 1. Pressure Grid (for isobars)
                // 2. Precip Grid (for shading)
                const gridPressure = interpolateGrid(weatherData, 'value');
                
                // --- APPLY BAYESIAN / GAUSSIAN SMOOTHING ---
                // We apply 3 iterations to pressure for very rounded, organic isobars.
                smoothFieldData(gridPressure, 6); // Extra smoothing pass to compensate for coarser grid

                let gridPrecip = null;
                if (productType === 'rain') {
                    gridPrecip = interpolateGrid(weatherData, 'precip');
                    // We apply 1 iteration to rain to keep it somewhat defined but less pixelated
                    smoothFieldData(gridPrecip, 1);
                }

                const systems = findSystems(gridPressure, productType);

                // Render to Buffer
                bufferCtx.fillStyle = '#ffffff';
                bufferCtx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                if (typeof d3 === 'undefined') throw new Error("Mapping library (D3) failed to load.");

                const projection = drawMap(bufferCtx, lat, lon, CANVAS_WIDTH, CANVAS_HEIGHT, radius);
                
                // Draw Precip FIRST (so it is underneath lines)
                if (gridPrecip) {
                    drawPrecipitation(bufferCtx, projection, gridPrecip);
                }

                drawContours(bufferCtx, projection, gridPressure, productType);
                drawStationModels(bufferCtx, projection, weatherData);
                drawSystemLabels(bufferCtx, projection, systems);

                let productTitle = "SURFACE ANALYSIS";
                if (productType === 'surface') {
                    if (hourOffset === 12) productTitle = "SURFACE PROG H+12";
                    if (hourOffset === 24) productTitle = "SURFACE PROG H+24";
                } else if (productType === '500hpa') {
                    productTitle = "500MB ANALYSIS";
                    if (hourOffset === 12) productTitle = "500MB PROG H+12";
                    if (hourOffset === 24) productTitle = "500MB PROG H+24";
                } else if (productType === 'rain') {
                    if (hourOffset === 12) productTitle = "RAIN/SURFACE PROG H+12";
                    if (hourOffset === 24) productTitle = "RAIN/SURFACE PROG H+24";
                }

                drawHeader(bufferCtx, productTitle, weatherData.validTime);

                loadingOverlay.style.display = 'none';
                isReceiving = true;
                statusLed.className = "status-led led-receiving";
                scanY = 0;
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                
                animateScan();

            } catch (err) {
                loadingOverlay.style.display = 'none';
                alert("FAX ERROR: " + err.message);
                console.error(err);
                receiveBtn.disabled = false;
                isReceiving = false;
                statusLed.className = "status-led led-active";
            }
        }

        // --- Init ---
        loadSettings();

        gpsBtn.addEventListener('click', () => {
            if ("geolocation" in navigator) {
                gpsBtn.innerHTML = "...";
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        latInput.value = pos.coords.latitude.toFixed(1);
                        lonInput.value = pos.coords.longitude.toFixed(1);
                        saveSettings(); 
                        gpsBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>`;
                    }, 
                    (err) => { alert("GPS Error: " + err.message); gpsBtn.innerHTML = "X"; }
                );
            }
        });

        receiveBtn.addEventListener('click', startFaxProcess);
        
        statusLed.className = "status-led led-active";
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.font = "20px 'VT323'";
        ctx.fillStyle = "#000";
        ctx.fillText("READY - AWAITING TRANSMISSION", 20, 30);

    </script>
</body>
